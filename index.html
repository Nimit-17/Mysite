<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nimit Limbachiya's animated personal bio."
    />
    <meta name="theme-color" content="#070716" />
    <title>Nimit Limbachiya</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/photos/mirror-close.webp" as="image" />
    <link rel="preload" href="assets/photos/origin-waterfall.webp" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="film" aria-label="Animated personal bio">
      <section class="sequence" id="sequence" aria-live="polite" aria-atomic="true">
        <div class="wash wash-a" aria-hidden="true"></div>
        <div class="wash wash-b" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>
        <div class="halftone" aria-hidden="true"></div>
        <div class="speedlines" aria-hidden="true"></div>

        <div class="frame-stack" aria-hidden="true">
          <figure class="shot shot-main">
            <img id="heroPhoto" src="assets/photos/mirror-close.webp" alt="" decoding="async" fetchpriority="high" />
          </figure>
          <figure class="shot shot-side shot-one">
            <img id="sidePhotoA" src="assets/photos/brick-thinker.webp" alt="" decoding="async" />
          </figure>
          <figure class="shot shot-side shot-two">
            <img id="sidePhotoB" src="assets/photos/lego-spider.webp" alt="" decoding="async" />
          </figure>
          <figure class="shot shot-side shot-three">
            <img id="sidePhotoC" src="assets/photos/neon-bull.webp" alt="" decoding="async" />
          </figure>
        </div>

        <div class="script-card">
          <p class="script-line" id="scriptLine">Alright let's do this one last time.</p>
        </div>

        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      </section>

      <section class="montage" id="montage" aria-label="Photo collage">
        <div class="montage-grid">
          <figure class="tile tile-a"><img src="assets/photos/origin-waterfall.webp" alt="Nimit standing in front of a waterfall" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-b"><img src="assets/photos/brick-thinker.webp" alt="Nimit sitting beside a brick wall" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-c"><img src="assets/photos/lego-spider.webp" alt="A Spider-Man LEGO minifigure" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-d"><img src="assets/photos/neon-bull.webp" alt="Nimit beside neon wall art" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-e"><img src="assets/photos/jacket-pose.webp" alt="Nimit posing indoors with a jacket" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-f"><img src="assets/photos/mirror-arch.webp" alt="Nimit standing in front of an arched mirror" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-g"><img src="assets/photos/bed-stare.webp" alt="Nimit sitting on a bed looking to the side" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-h"><img src="assets/photos/smile-dinner.webp" alt="Nimit smiling at a restaurant" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-i"><img src="assets/photos/neon-parking.webp" alt="Nimit in front of a neon sign" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-j"><img src="assets/photos/pool-sideeye.webp" alt="Nimit looking sideways beside a pool" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-k"><img src="assets/photos/cake-lore.webp" alt="Nimit with a cake at a table" loading="lazy" decoding="async" /></figure>
          <figure class="tile tile-l"><img src="assets/photos/mirror-glitch.webp" alt="Nimit taking a mirror selfie" loading="lazy" decoding="async" /></figure>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
