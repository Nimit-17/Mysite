<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimit Limbachiya</title>
<meta name="description" content="Nimit Limbachiya — personal site.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070604'/%3E%3Cpath d='M16 6c-4 5-8 7.5-8 11a4.4 4.4 0 0 0 6.8 3.7L13.5 26h5l-1.3-5.3A4.4 4.4 0 0 0 24 17c0-3.5-4-6-8-11z' fill='%23e8dfc8'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #070604; overflow: hidden; }
  body { cursor: default; -webkit-tap-highlight-color: transparent; }

  #pin { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* The video is a texture source only — it is composited into the canvas,
     never shown as its own layer. It must stay renderable (not display:none)
     for browsers to keep decoding frames. */
  #intro {
    position: absolute; top: 0; left: 0; width: 2px; height: 2px;
    opacity: 0; pointer-events: none; z-index: 0;
  }

  /* Real DOM heading — the name the particles resolve into. This is the only
     copy on the page, so it has to be text, not canvas pixels. */
  #name {
    position: absolute; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    font: 600 64px/1 Georgia, "Times New Roman", serif;
    color: #ffdca8; letter-spacing: .01em; text-align: center;
    text-shadow: 0 0 34px rgba(255,168,78,.34), 0 0 90px rgba(255,140,50,.16);
    opacity: 0; pointer-events: none; will-change: opacity;
  }

  #cue {
    position: absolute; left: 50%; bottom: clamp(18px, 4vh, 46px);
    transform: translateX(-50%); z-index: 3;
    font: 400 11px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .34em; text-transform: uppercase;
    color: rgba(255,224,190,.5); opacity: 0;
    transition: opacity .7s ease; pointer-events: none;
  }
  #cue.show { opacity: 1; }
  #cue span { display: block; width: 1px; height: 26px; margin: 10px auto 0;
    background: linear-gradient(rgba(255,200,140,.55), rgba(255,200,140,0)); }
  #cue.anim span { animation: drip 1.9s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0%,100% { transform: scaleY(.35); opacity: .35 } 50% { transform: scaleY(1); opacity: 1 } }

  #pre {
    position: absolute; inset: 0; z-index: 5; background: #070604;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .8s ease;
  }
  #pre.gone { opacity: 0; pointer-events: none; }

  #spark {
    width: 8px; height: 8px; border-radius: 50%; background: #f6c98d;
    box-shadow: 0 0 18px 6px rgba(255,150,60,.5);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(.6); opacity: .45 }
    50%     { transform: scale(1);  opacity: .95 }
  }
  /* Softened opener: peaks at a warm ember bloom, not a white-out.
     Interim treatment — see the notes on replacing this beat entirely. */
  #spark.ignite { animation: ignite 1.7s cubic-bezier(.4,0,.5,1) forwards; }
  @keyframes ignite {
    0%   { transform: scale(.4); opacity: 0;  box-shadow: 0 0 6px 2px rgba(255,150,60,.25) }
    30%  { transform: scale(1);  opacity: .9; box-shadow: 0 0 26px 9px rgba(255,150,60,.5) }
    62%  { transform: scale(2.6); opacity: .8; box-shadow: 0 0 54px 18px rgba(255,150,60,.42) }
    100% { transform: scale(26); opacity: 0;  box-shadow: 0 0 70px 28px rgba(255,150,60,0) }
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    #spark { animation: none; opacity: .8 }
    #spark.ignite { animation: none; opacity: 0 }
    #cue.anim span { animation: none }
  }
</style>
</head>
<body>
  <div id="pin">
    <canvas id="stage" aria-hidden="true"></canvas>
    <video id="intro" muted playsinline preload="auto" aria-hidden="true" tabindex="-1">
      <!-- VP9 + alpha. Safari cannot composite this; the runtime alpha probe
           below detects that and plays the canvas entrance instead. Dropping an
           HEVC-with-alpha `intro-alpha.mp4` (hvc1) in as a second <source>
           would give Safari the real thing. -->
      <source src="assets/intro.webm" type="video/webm">
    </video>

    <h1 id="name">Nimit Limbachiya</h1>
    <p id="cue">scroll<span></span></p>
    <p class="sr">Scroll, or press the down arrow key, to reveal the name.</p>

    <div id="pre"><div id="spark"></div></div>
  </div>

<script>
'use strict';

const params  = new URLSearchParams(location.search);
const DEBUG   = params.get('debug') === '1';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches
             && params.get('motion') !== 'full';

const stage  = document.getElementById('stage');
const ctx    = stage.getContext('2d', { alpha: false });
const vid    = document.getElementById('intro');
const pre    = document.getElementById('pre');
const spark  = document.getElementById('spark');
const nameEl = document.getElementById('name');
const cueEl  = document.getElementById('cue');

/* ---------------------------------------------------------------- geometry
   card.png is 1053x1494, 24-bit, NO alpha: everything outside the card's
   rounded silhouette is opaque black. Measured from the pixels:
     - a 6px black margin on all four straight edges
     - corner radius ~85px from the file edge, so ~79px from the card's own edge
   Both numbers are cropped/masked out below. The old 5%-of-width radius left
   an opaque wedge in every corner and never touched the straight edges at all,
   which is the black frame that kept showing up against the embers.          */
const SRC_W = 1053, SRC_H = 1494, MARGIN = 6;
const VIS_W = SRC_W - MARGIN * 2;              // 1041
const VIS_H = SRC_H - MARGIN * 2;              // 1482
const ASPECT = VIS_W / VIS_H;                  // 0.70243
const R_FRAC = 79 / VIS_W;                     // 0.07589

const VID_W = 1920, VID_H = 1080;
/* The card occupies 94% of the video's height, and that includes card.png's
   own 6px margins — so the *visible* card in video space is slightly shorter.
   The video is scaled to make this height match `card.h`, which is what keeps
   the hand-off from jumping. */
const CARD_IN_VID_H = 0.94 * VID_H * (VIS_H / SRC_H);   // 1007.05

const PLAYBACK = 0.75;                         // intro speed
const NAME = 'Nimit Limbachiya';
const GOLD = 'rgb(255,175,95)', GOLD_HI = 'rgb(255,210,130)';

let W = 0, H = 0, dpr = 1, mx = 0.5, my = 0.5, portrait = false;
let card = { x: 0, y: 0, w: 0, h: 0 };
let cell = 4, nameFs = 64;

const img = new Image();

/* Deterministic RNG: a resize rebuilds every particle, and reseeding from the
   same value keeps the dust from visibly re-rolling mid-dissolve. */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

function layoutCard() {
  /* Sized from the viewport, not from the video's letterbox scale. The old
     `min(W/1920, H/1080)` collapsed the card to ~145x206 on a phone. */
  const maxH = H * (portrait ? 0.70 : 0.94);
  const maxW = W * (portrait ? 0.88 : 0.92);
  let h = maxH, w = h * ASPECT;
  if (w > maxW) { w = maxW; h = w / ASPECT; }
  card = { x: (W - w) / 2, y: (H - h) / 2, w, h };
}

/* ------------------------------------------------------------- text targets */
const TS = 0.5;                                 // sample at half res
let textPts = [];
function buildText() {
  textPts = [];
  const tw = Math.max(1, Math.round(W * TS)), th = Math.max(1, Math.round(H * TS));
  const o = document.createElement('canvas'); o.width = tw; o.height = th;
  const c = o.getContext('2d');
  const setF = (v) => { c.font = `600 ${v}px Georgia, "Times New Roman", serif`; };
  let fs = Math.min(tw * 0.075, th * 0.16);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  setF(fs);
  while (c.measureText(NAME).width > tw * 0.86 && fs > 6) { fs -= 1; setF(fs); }
  nameFs = fs / TS;
  nameEl.style.fontSize = nameFs + 'px';
  c.fillText(NAME, tw / 2, th / 2);
  const d = c.getImageData(0, 0, tw, th).data;
  const step = Math.max(1, Math.round(fs / 40));
  for (let y = 0; y < th; y += step)
    for (let x = 0; x < tw; x += step)
      if (d[(y * tw + x) * 4 + 3] > 128) textPts.push({ x: x / TS, y: y / TS });
}

/* ------------------------------------------------------------ card + dust */
let cardCanvas = null, cardLayer = null, lctx = null;
let particles = [], eraseCells = [], colGroups = [], textParts = [], textPartsHi = [], extraParts = [];
let erasePtr = 0, lastDp = -1;
const ASTEPS = 8;                               // alpha quantisation for batching
let scratch = [], scratchN = new Int32Array(ASTEPS);

function buildParticles() {
  if (!img.naturalWidth) return false;
  layoutCard();
  const rnd = mulberry32(0x5EEDCA2D);
  const cw = Math.max(1, Math.round(card.w)), ch = Math.max(1, Math.round(card.h));

  const off = document.createElement('canvas'); off.width = cw; off.height = ch;
  const octx = off.getContext('2d');
  // crop the 6px black margin away, then mask with the card's true corner radius
  octx.drawImage(img, MARGIN, MARGIN, VIS_W, VIS_H, 0, 0, cw, ch);
  octx.globalCompositeOperation = 'destination-in';
  const r = cw * R_FRAC;
  octx.beginPath();
  octx.moveTo(r, 0);
  octx.arcTo(cw, 0, cw, ch, r); octx.arcTo(cw, ch, 0, ch, r);
  octx.arcTo(0, ch, 0, 0, r);   octx.arcTo(0, 0, cw, 0, r);
  octx.closePath(); octx.fill();
  octx.globalCompositeOperation = 'source-over';
  cardCanvas = off;

  cardLayer = document.createElement('canvas'); cardLayer.width = cw; cardLayer.height = ch;
  lctx = cardLayer.getContext('2d');

  /* Reading the card back requires the image to be same-origin. Opened straight
     off the disk as file://, Chrome taints the canvas and this throws — so the
     page has to be served over http (any static server will do). */
  let data;
  try {
    data = octx.getImageData(0, 0, cw, ch).data;
  } catch (e) {
    console.error('[card] cannot sample card.png (' + e.name + '). Serve this over http:// rather than opening the file directly.');
    return false;
  }
  cell = Math.max(3, Math.round(card.w / 135));
  particles = []; eraseCells = [];

  for (let y = 0; y < ch; y += cell) for (let x = 0; x < cw; x += cell) {
    const sx = Math.min(cw - 1, x + (cell >> 1)), sy = Math.min(ch - 1, y + (cell >> 1));
    const i = (sy * cw + sx) * 4;
    if (data[i + 3] < 128) continue;
    const edt = Math.min(1, Math.min(x, cw - x, y, ch - y) / (Math.min(cw, ch) * 0.42));
    const delay = 0.42 * edt + 0.16 * ((ch - y) / ch) + rnd() * 0.12;
    eraseCells.push({ hx: x, hy: y, delay });
    const rr = data[i], g = data[i + 1], b = data[i + 2];
    if (rr + g + b < 30) continue;
    particles.push({
      hx: x, hy: y, r: rr, g: g, b: b, delay,
      sp: rnd(), up: rnd(), ph: rnd() * 6.28,
      bright: rnd() < 0.22,               // was never set, so the bright gold was dead
      tx: null, ty: null,
    });
  }

  // incremental erase needs the cells in reveal order
  eraseCells.sort((a, b) => a.delay - b.delay);
  erasePtr = 0; lastDp = -1;

  buildText();

  // assign a dense subset to the name; the rest drift off during reassembly
  const order = particles.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const s = order[i]; order[i] = order[j]; order[j] = s;
  }
  const need = Math.min(order.length, textPts.length * 2);
  for (let k = 0; k < need; k++) {
    const p = particles[order[k]], tp = textPts[k % textPts.length];
    p.tx = tp.x; p.ty = tp.y;
  }

  /* Perf: the old loop built a `rgb(...)` template string and assigned
     ctx.fillStyle once per particle per frame — ~14k string allocations and CSS
     colour parses every frame. Colours are quantised to 4 bits per channel and
     bucketed at build time, so a frame now sets fillStyle a few dozen times.
     Reassembly is two buckets, and its alpha is uniform, so that phase sets
     fillStyle and globalAlpha twice total. */
  const map = new Map();
  colGroups = [];
  const qz = (v) => Math.round((v >> 5) * 36.43);        // 3 bits/channel
  for (const p of particles) {
    const key = ((p.r >> 5) << 6) | ((p.g >> 5) << 3) | (p.b >> 5);
    let grp = map.get(key);
    if (!grp) {
      grp = { css: `rgb(${qz(p.r)},${qz(p.g)},${qz(p.b)})`, items: [] };
      map.set(key, grp); colGroups.push(grp);
    }
    grp.items.push(p);
  }
  // sorted by delay so the dissolve loop can stop early while most are dormant
  let maxG = 0;
  for (const grp of colGroups) {
    grp.items.sort((a, b) => a.delay - b.delay);
    if (grp.items.length > maxG) maxG = grp.items.length;
  }
  /* Scratch buffers for batched drawing, reused every frame so the hot loop
     allocates nothing. Measured: ~27.7k individual fillRect calls with a
     per-particle globalAlpha costs 8.6ms/frame; collecting them into one path
     per (colour, alpha) bucket and filling that costs 3.9ms. */
  scratch = [];
  for (let s = 0; s < ASTEPS; s++) scratch.push(new Float32Array(Math.max(3, maxG * 3)));

  textParts = particles.filter((p) => p.tx != null && !p.bright);
  textPartsHi = particles.filter((p) => p.tx != null && p.bright);
  extraParts = particles.filter((p) => p.tx == null);
  return true;
}

/* --------------------------------------------------------------- ember world */
let embers = [], ash = [], grainPat = null, bgGrad = null;
let grainOx = 0, grainOy = 0, grainAt = 0;

function buildBg() {
  const rnd = mulberry32(0x1F0E5A11);
  const scale = REDUCED ? 0.34 : 1;
  embers = []; ash = [];
  const ne = Math.round(W * H / 20000 * scale), na = Math.round(W * H / 45000 * scale);
  for (let k = 0; k < ne; k++) embers.push({
    x: rnd() * W, y: rnd() * H, r: rnd() * 1.6 + 0.6,
    vy: rnd() * 0.8 + 0.3, ph: rnd() * 6.28, bright: rnd() < 0.25, z: rnd(),
  });
  for (let k = 0; k < na; k++) ash.push({
    x: rnd() * W, y: rnd() * H, r: rnd() * 1.1 + 0.5, vy: rnd() * 0.35 + 0.15, ph: rnd() * 6.28,
  });

  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#221a13'); bgGrad.addColorStop(1, '#0b0806');

  // one cached pattern instead of ~200 drawImage tiles per frame
  const n = document.createElement('canvas'); n.width = n.height = 140;
  const nx = n.getContext('2d'), id = nx.createImageData(140, 140);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = (rnd() * 255) | 0;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  nx.putImageData(id, 0, 0);
  grainPat = ctx.createPattern(n, 'repeat');
}

function drawBackground(t, dt) {
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  const gx = W * (0.5 + 0.1 * Math.cos(t * 0.15)), gy = H * 0.98;
  const bloom = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.72);
  bloom.addColorStop(0, 'rgba(200,120,55,0.24)'); bloom.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bloom; ctx.fillRect(0, 0, W, H);

  const lx = mx * W, ly = my * H;
  const cl = ctx.createRadialGradient(lx, ly, 0, lx, ly, Math.min(W, H) * 0.45);
  cl.addColorStop(0, 'rgba(255,170,80,0.10)'); cl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = cl; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  const drift = REDUCED ? 0.18 : 1;
  const k = dt * 60;
  ctx.fillStyle = 'rgba(160,160,170,0.12)';
  for (const a of ash) {
    a.y -= a.vy * k * drift; a.ph += 0.02 * k;
    if (a.y < -4) { a.y = H + 4; a.x = Math.random() * W; }
    ctx.beginPath(); ctx.arc(a.x + Math.sin(a.ph) * 8, a.y, a.r, 0, 6.2832); ctx.fill();
  }

  ctx.globalCompositeOperation = 'lighter';
  const px = (mx - 0.5) * 30;
  for (const e of embers) {
    e.y -= e.vy * k * drift; e.ph += 0.05 * k;
    if (e.y < -6) { e.y = H + 6; e.x = Math.random() * W; }
    const x = e.x + Math.sin(e.ph) * 10 + px * (0.3 + e.z);
    const flick = 0.45 + 0.55 * Math.sin(t * 3 + e.ph * 3);
    const col = e.bright ? '255,205,120' : '255,150,70';
    ctx.beginPath(); ctx.arc(x, e.y, e.r * 3.2, 0, 6.2832);
    ctx.fillStyle = `rgba(${col},${0.13 * flick})`; ctx.fill();
    ctx.beginPath(); ctx.arc(x, e.y, e.r, 0, 6.2832);
    ctx.fillStyle = `rgba(${col},${(e.bright ? 0.9 : 0.6) * flick})`; ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function post(now) {
  if (grainPat) {
    // real film grain resamples ~12x a second, not every frame
    if (!REDUCED && now - grainAt > 80) {
      grainOx = (Math.random() * 140) | 0; grainOy = (Math.random() * 140) | 0; grainAt = now;
    }
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.translate(-grainOx, -grainOy);
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W + 140, H + 140);
    ctx.restore();
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.82);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ------------------------------------------------------------ video texture
   The video used to sit in its own DOM layer above the canvas. Browsers
   composite video separately, with its own colour management, which is what
   made the hand-off pulse — and the ember background met the matte's edge with
   nothing bridging them. Drawing it into the canvas puts both through one
   pipeline: one bloom, one grain, one vignette, and a feathered left/right edge
   that dissolves the seam into the embers. */
let vidLayer = null, vctx = null, feather = null, vidRect = { x: 0, y: 0, w: 0, h: 0 };

function buildVidLayer() {
  const s = card.h / CARD_IN_VID_H;
  const vw = VID_W * s, vh = VID_H * s;
  vidRect = { x: (W - vw) / 2, y: (H - vh) / 2, w: vw, h: vh };

  const pw = Math.max(2, Math.ceil(vw * dpr)), ph = Math.max(2, Math.ceil(vh * dpr));
  vidLayer = document.createElement('canvas'); vidLayer.width = pw; vidLayer.height = ph;
  vctx = vidLayer.getContext('2d');

  /* Feather the left and right edges only. Top and bottom are left hard on
     purpose: the card fills 94% of the video's height, so a vertical feather
     would eat into the card's own top and bottom edge. */
  feather = document.createElement('canvas'); feather.width = pw; feather.height = ph;
  const f = feather.getContext('2d');
  f.fillStyle = '#fff'; f.fillRect(0, 0, pw, ph);
  f.globalCompositeOperation = 'destination-out';
  const fw = pw * 0.06;
  let g = f.createLinearGradient(0, 0, fw, 0);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = g; f.fillRect(0, 0, fw, ph);
  g = f.createLinearGradient(pw, 0, pw - fw, 0);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = g; f.fillRect(pw - fw, 0, fw, ph);
}

function drawVideo(alpha) {
  if (!vidLayer || vid.readyState < 2) return false;
  vctx.clearRect(0, 0, vidLayer.width, vidLayer.height);
  vctx.drawImage(vid, 0, 0, vidLayer.width, vidLayer.height);
  vctx.globalCompositeOperation = 'destination-in';
  vctx.drawImage(feather, 0, 0);
  vctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  ctx.drawImage(vidLayer, vidRect.x, vidRect.y, vidRect.w, vidRect.h);
  ctx.globalAlpha = 1;
  return true;
}

/* ------------------------------------------------------- card + reassembly */
function drawCard(alpha) {
  if (!cardCanvas) return;
  ctx.globalAlpha = alpha;
  ctx.drawImage(cardCanvas, card.x, card.y, card.w, card.h);
  ctx.globalAlpha = 1;
}

/* Canvas entrance, used when the video can't be composited (Safari) or fails. */
function drawEntrance(e) {
  if (!cardCanvas) return;
  const k = 1 - Math.pow(1 - e, 3);
  const s = 1.16 - 0.16 * k;
  ctx.save();
  ctx.translate(W / 2, H / 2 + (1 - k) * H * 0.05);
  ctx.rotate((1 - k) * -0.07);
  ctx.scale(s, s);
  ctx.globalAlpha = Math.min(1, e * 2.4);
  ctx.drawImage(cardCanvas, -card.w / 2, -card.h / 2, card.w, card.h);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawParticles(prog, t) {
  if (!cardCanvas) return;
  if (prog <= 0.004) { drawCard(1); return; }

  const dp = Math.min(1, prog / 0.5), rp = Math.max(0, (prog - 0.5) / 0.5);
  const win = 0.3, sc = card.w / cardLayer.width;

  if (rp <= 0) {
    /* Incremental erase. This used to clear the layer and re-fill every one of
       ~28k cells on every frame; now it only stamps the cells that just crossed
       their threshold, and only rebuilds from scratch when scrubbed backwards. */
    if (dp < lastDp) {
      lctx.clearRect(0, 0, cardLayer.width, cardLayer.height);
      lctx.drawImage(cardCanvas, 0, 0);
      erasePtr = 0;
    }
    if (lastDp < 0) { lctx.clearRect(0, 0, cardLayer.width, cardLayer.height); lctx.drawImage(cardCanvas, 0, 0); }
    lctx.globalCompositeOperation = 'destination-out';
    /* Integer-aligned and overlapping by 1px: destination-out then covers whole
       pixels, so re-stamping a cell is idempotent. With half-pixel offsets a
       scrub back through the reassembly range re-erased every antialiased cell
       boundary a second time and softened the dissolve edges. */
    while (erasePtr < eraseCells.length && eraseCells[erasePtr].delay < dp) {
      const q = eraseCells[erasePtr++];
      lctx.fillRect(q.hx - 1, q.hy - 1, cell + 2, cell + 2);
    }
    lctx.globalCompositeOperation = 'source-over';
    lastDp = dp;
    ctx.drawImage(cardLayer, card.x, card.y, card.w, card.h);
  } else {
    lastDp = dp;
  }

  const te = rp * rp * (3 - 2 * rp);
  const solid = smooth(0.88, 1, prog);          // hand-off to the DOM heading
  const baseSz = cell * sc;
  ctx.globalCompositeOperation = 'lighter';

  if (rp <= 0) {
    for (const grp of colGroups) {
      const items = grp.items;
      scratchN.fill(0);
      for (let i = 0; i < items.length; i++) {
        const q = items[i];
        const lp = (dp - q.delay) / win;
        if (lp <= 0) break;                     // sorted by delay — rest are dormant
        const l = lp > 1 ? 1 : lp;
        const e = l * l;
        const hx = card.x + q.hx * sc, hy = card.y + q.hy * sc;
        const x = hx + e * card.w * 0.14 + e * (30 + q.sp * 150) + Math.sin(t * 1.6 + q.ph) * e * 20;
        const y = hy - e * card.h * (0.55 + q.up * 0.7) - e * 30 + Math.cos(t * 1.3 + q.ph) * e * 16;
        const s = Math.round((1 - l) * (ASTEPS - 1));
        if (s === 0) continue;                  // fully faded — nothing to draw
        const buf = scratch[s]; const n = scratchN[s];
        buf[n] = x; buf[n + 1] = y;
        buf[n + 2] = 1.3 + (baseSz - 1.3) * Math.max(0, 1 - l / 0.16);
        scratchN[s] = n + 3;
      }
      ctx.fillStyle = grp.css;
      for (let s = 1; s < ASTEPS; s++) {
        const n = scratchN[s];
        if (!n) continue;
        ctx.globalAlpha = s / (ASTEPS - 1);
        const buf = scratch[s];
        ctx.beginPath();
        for (let i = 0; i < n; i += 3) ctx.rect(buf[i], buf[i + 1], buf[i + 2], buf[i + 2]);
        ctx.fill();
      }
    }
  } else {
    /* Reassembly: alpha is uniform across each list, so each one is a single
       path and a single fill — two fills for the name, one for the strays. */
    const sz = 1.4 + rp * 0.8;
    const drawTo = (list, css, alpha, stray) => {
      if (alpha <= 0.004 || !list.length) return;
      ctx.fillStyle = css; ctx.globalAlpha = alpha;
      ctx.beginPath();
      for (let i = 0; i < list.length; i++) {
        const q = list[i];
        const hx = card.x + q.hx * sc, hy = card.y + q.hy * sc;
        const scx = hx + card.w * 0.14 + (30 + q.sp * 150) + Math.sin(t * 1.6 + q.ph) * 20;
        const scy = hy - card.h * (0.55 + q.up * 0.7) - 30 + Math.cos(t * 1.3 + q.ph) * 16;
        if (stray) ctx.rect(scx + Math.sin(t + q.ph) * 20 * rp, scy - rp * 120, sz, sz);
        else ctx.rect(scx + (q.tx - scx) * te, scy + (q.ty - scy) * te, sz, sz);
      }
      ctx.fill();
    };
    const nameAlpha = (0.35 + 0.65 * rp) * (1 - solid);
    drawTo(textParts, GOLD, nameAlpha, false);
    drawTo(textPartsHi, GOLD_HI, nameAlpha, false);
    drawTo(extraParts, GOLD, (1 - rp) * 0.5, true);      // strays drift up and fade
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  nameEl.style.opacity = solid;
}

/* --------------------------------------------------------------- input */
let target = 0, prog = 0;
/* Chrome reports ~100px per wheel notch; Firefox in line mode reports ~3 lines.
   33px/line makes a notch feel the same in both. */
const LINE = 33, PAGE = 120, STEP = 0.085;

function bump(d) {
  if (state !== 'card') return;
  target = Math.min(1, Math.max(0, target + d));
  if (target > 0.02) showCue(false);
}

function wheelAmount(e) {
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= LINE;             // Firefox reports lines, not px
  else if (e.deltaMode === 2) d *= PAGE;
  return Math.max(-140, Math.min(140, d));      // one violent trackpad fling ≠ whole animation
}

addEventListener('wheel', (e) => { e.preventDefault(); bump(wheelAmount(e) * 0.0009); }, { passive: false });
addEventListener('pointermove', (e) => { mx = e.clientX / W; my = e.clientY / H; });

let lastY = null;
addEventListener('touchstart', (e) => { lastY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (lastY != null) bump((lastY - e.touches[0].clientY) * 0.0016);
  lastY = e.touches[0].clientY;
}, { passive: false });
addEventListener('touchend', () => { lastY = null; }, { passive: true });

/* Keyboard. The wheel handler preventDefaults everything and the body is
   overflow:hidden, so without this the page cannot be advanced at all. */
const KEYS = {
  ArrowDown: STEP, ArrowRight: STEP, PageDown: STEP * 3, ' ': STEP * 3, Spacebar: STEP * 3,
  ArrowUp: -STEP, ArrowLeft: -STEP, PageUp: -STEP * 3,
};
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Home') { e.preventDefault(); target = 0; return; }
  if (e.key === 'End')  { e.preventDefault(); target = 1; showCue(false); return; }
  const d = KEYS[e.key];
  if (d === undefined) return;
  e.preventDefault();
  bump(d);
});

/* --------------------------------------------------------------- lifecycle */
let state = 'pre';                              // pre | intro | entrance | card
let xfade = 0, entrance = 0, cueShown = false;

function showCue(on) {
  if (on === cueShown) return;
  cueShown = on;
  cueEl.classList.toggle('show', on);
  cueEl.classList.toggle('anim', on && !REDUCED);
}

function toCard() { if (state !== 'card') { state = 'card'; showCue(true); } }

/* Safari decodes VP9 but ignores the alpha channel, so the intro would render
   as an opaque black slab rather than failing outright. Probe the decoded frame
   instead of trusting the codec string. */
function alphaWorks() {
  try {
    const p = document.createElement('canvas'); p.width = p.height = 8;
    const pc = p.getContext('2d');
    pc.clearRect(0, 0, 8, 8);
    pc.drawImage(vid, 0, 0, 8, 8);
    const d = pc.getImageData(0, 0, 8, 8).data;
    const corners = [0, 7, 56, 63].map((i) => d[i * 4 + 3]);
    return Math.min.apply(null, corners) < 200;
  } catch { return false; }
}

let videoFailed = false;
function failVideo(why) {
  if (videoFailed) return;
  videoFailed = true;
  if (DEBUG) console.warn('[intro] falling back to canvas entrance:', why);
  try { vid.pause(); } catch { /* already gone */ }
  if (state === 'pre' || state === 'intro') { state = 'entrance'; entrance = 0; }
}

vid.addEventListener('error', () => failVideo('media error'));
vid.addEventListener('stalled', () => failVideo('stalled'));
vid.addEventListener('loadeddata', () => { if (!alphaWorks()) failVideo('no alpha compositing'); });
vid.addEventListener('ended', () => { if (state === 'intro') xfade = 0.0001; });

/* Watchdog on real playback progress. The old check was
   `intro.paused || currentTime === 0`, which a video that is playing but wedged
   mid-buffer satisfies neither of — leaving the page stuck on the embers with
   no card and no way out. */
let seenTime = -1, seenAt = 0;
function watchdog(now) {
  if (state !== 'intro') return;
  if (vid.currentTime !== seenTime) { seenTime = vid.currentTime; seenAt = now; return; }
  if (now - seenAt > 1500) failVideo('no progress for 1.5s');
}

function startIntro() {
  pre.classList.add('gone');
  if (REDUCED || videoFailed) { toCard(); return; }
  state = 'intro'; seenTime = -1; seenAt = performance.now();
  vid.currentTime = 0;
  vid.playbackRate = PLAYBACK;
  const p = vid.play();
  if (p && p.catch) p.catch(() => failVideo('play() rejected'));
}

/* Gate the opener on the assets actually being ready instead of a bare 1600ms
   timer, so a slow connection can't produce a black gap. */
function ready(promise, ms) {
  return Promise.race([promise, new Promise((res) => setTimeout(() => res('timeout'), ms))]);
}
/* card.webp is the same 1053x1494 art at q92 — 246KB against the PNG's 2271KB,
   for a mean error of 1.5/255. The PNG stays as the fallback and the master. */
const imgReady = new Promise((res) => {
  let triedPng = false;
  img.onload = () => res('ok');
  img.onerror = () => {
    if (!triedPng) { triedPng = true; img.src = 'assets/card.png'; return; }
    console.error('[card] could not load the card image');
    res('error');
  };
  img.src = 'assets/card.webp';
});
const vidReady = new Promise((res) => {
  if (REDUCED) return res('skipped');
  vid.addEventListener('canplaythrough', () => res('ok'), { once: true });
  vid.addEventListener('error', () => res('error'), { once: true });
});

Promise.all([ready(imgReady, 8000), ready(vidReady, 6000)]).then(() => {
  resize();
  if (REDUCED) { startIntro(); return; }
  spark.classList.add('ignite');
  setTimeout(startIntro, 1250);
});

/* --------------------------------------------------------------- resize */
let rt = null, lastW = -1, lastH = -1;
function resize() {
  /* A hidden pane, a restoring background tab, or some embedded contexts report
     a 0x0 viewport. Building the world at that size produces a degenerate
     scene, so wait for real dimensions instead. */
  if (innerWidth < 2 || innerHeight < 2) {
    clearTimeout(rt); rt = setTimeout(resize, 200);
    return;
  }
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  portrait = H > W;
  stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildParticles();
  buildBg();
  buildVidLayer();
  lastW = W; lastH = H;
}
/* Debounced: this rebuilds every particle and samples a full-viewport canvas,
   and browsers fire resize continuously while a window edge is dragged (and
   whenever a mobile URL bar shows or hides). */
addEventListener('resize', () => {
  if (innerWidth === lastW && innerHeight === lastH) return;
  clearTimeout(rt);
  rt = setTimeout(resize, 150);
});
addEventListener('orientationchange', () => { clearTimeout(rt); rt = setTimeout(resize, 250); });

/* --------------------------------------------------------------- frame */
let t0 = performance.now(), last = t0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;

  // frame-rate independent: the old *0.12 per frame ran 2.4x faster at 144Hz
  prog += (target - prog) * (1 - Math.exp(-7.6 * dt));

  drawBackground(t, dt);
  watchdog(now);

  if (state === 'intro') {
    if (xfade > 0) {
      xfade = Math.min(1, xfade + dt / 0.26);
      const e = smooth(0, 1, xfade);
      /* Order matters. Drawing the video at (1-e) and the card at e composites
         each against the embers separately, so the result is
         C*e + V*(1-e)^2 + B*e*(1-e) -- at the midpoint the card is only 75%
         covered and the background bleeds through as a visible dip. Laying the
         card down opaque first and dissolving the video over it gives
         V*(1-e) + C*e, which holds full opacity the whole way across. */
      drawCard(1);
      drawVideo(1 - e);
      if (xfade >= 1) toCard();
    } else if (!drawVideo(1)) {
      drawCard(1);                              // first frames not decoded yet
    }
  } else if (state === 'entrance') {
    entrance = Math.min(1, entrance + dt / 0.95);
    drawEntrance(entrance);
    if (entrance >= 1) toCard();
  } else if (state === 'card') {
    drawParticles(prog, t);
  }

  post(now);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

if (DEBUG) {
  window.__set = (p) => { target = prog = p; toCard(); };
  window.__state = () => ({ W, H, dpr, cell, state, prog, target, portrait,
    particles: particles.length, groups: colGroups.length, textPts: textPts.length,
    card, vidRect, videoFailed });
}
</script>
</body>
</html>
