<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimit Limbachiya</title>
<meta name="description" content="Nimit Limbachiya — personal site.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070604'/%3E%3Cpath d='M16 6c-4 5-8 7.5-8 11a4.4 4.4 0 0 0 6.8 3.7L13.5 26h5l-1.3-5.3A4.4 4.4 0 0 0 24 17c0-3.5-4-6-8-11z' fill='%23e8dfc8'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #070604; overflow: hidden; }
  body { cursor: default; -webkit-tap-highlight-color: transparent; }

  #pin { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* The video is a texture source only — it is composited into the canvas,
     never shown as its own layer. It must stay renderable (not display:none)
     for browsers to keep decoding frames. */
  #intro {
    position: absolute; top: 0; left: 0; width: 2px; height: 2px;
    opacity: 0; pointer-events: none; z-index: 0;
  }

  /* The name is drawn as dust on the canvas, which is the whole point of the
     piece — so it must not also be set as type. The heading stays in the DOM,
     visually hidden, carrying the same words for screen readers and crawlers
     that the shards spell out visually. */
  #name {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  #cue {
    position: absolute; left: 50%; bottom: clamp(18px, 4vh, 46px);
    transform: translateX(-50%); z-index: 3;
    font: 400 11px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .34em; text-transform: uppercase;
    color: rgba(255,224,190,.5); opacity: 0;
    transition: opacity .7s ease; pointer-events: none;
  }
  #cue.show { opacity: 1; }
  #cue span { display: block; width: 1px; height: 26px; margin: 10px auto 0;
    background: linear-gradient(rgba(255,200,140,.55), rgba(255,200,140,0)); }
  #cue.anim span { animation: drip 1.9s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0%,100% { transform: scaleY(.35); opacity: .35 } 50% { transform: scaleY(1); opacity: 1 } }

  #pre {
    position: absolute; inset: 0; z-index: 5; background: #070604;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .8s ease;
  }
  #pre.gone { opacity: 0; pointer-events: none; }

  #spark {
    width: 8px; height: 8px; border-radius: 50%; background: #f6c98d;
    box-shadow: 0 0 18px 6px rgba(255,150,60,.5);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(.6); opacity: .45 }
    50%     { transform: scale(1);  opacity: .95 }
  }
  /* Softened opener: peaks at a warm ember bloom, not a white-out.
     Interim treatment — see the notes on replacing this beat entirely. */
  #spark.ignite { animation: ignite 1.7s cubic-bezier(.4,0,.5,1) forwards; }
  @keyframes ignite {
    0%   { transform: scale(.4); opacity: 0;  box-shadow: 0 0 6px 2px rgba(255,150,60,.25) }
    30%  { transform: scale(1);  opacity: .9; box-shadow: 0 0 26px 9px rgba(255,150,60,.5) }
    62%  { transform: scale(2.6); opacity: .8; box-shadow: 0 0 54px 18px rgba(255,150,60,.42) }
    100% { transform: scale(26); opacity: 0;  box-shadow: 0 0 70px 28px rgba(255,150,60,0) }
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; }

  /* The pointer belongs to the whole site, so it is deliberately *not* made of
     any one act's material. An ember was right for the fire and would have been
     wrong on obsidian, on water, on anything that comes later. A ring and a dot
     read as an instrument rather than as a piece of the scene, and they stay
     legible on black and on molten orange alike.

     `nocur` is added from script, never from the stylesheet: if the script fails
     the native cursor has to survive. DOM rather than canvas, because the opener
     covers the canvas and the pointer has to exist over it too. */
  html.nocur, html.nocur * { cursor: none; }

  .cur {
    position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none;
    opacity: 0; transition: opacity .4s ease; will-change: transform;
  }
  .cur.on { opacity: 1; }
  #curDot {
    width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: #f7f1e7; box-shadow: 0 0 7px rgba(0,0,0,.6);
  }
  #curRing {
    width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    border: 1px solid rgba(247,241,231,.5);
    box-shadow: 0 0 9px rgba(0,0,0,.34), inset 0 0 9px rgba(0,0,0,.22);
  }

  @media (prefers-reduced-motion: reduce) {
    #spark { animation: none; opacity: .8 }
    #spark.ignite { animation: none; opacity: 0 }
    #cue.anim span { animation: none }
  }
</style>

/* ---------------------------------------------------------------- geometry
   card.png is 1053x1494, 24-bit, NO alpha: everything outside the card's
   rounded silhouette is opaque black. Measured from the pixels:
     - a 6px black margin on all four straight edges
     - corner radius ~85px from the file edge, so ~79px from the card's own edge
   Both numbers are cropped/masked out below. The old 5%-of-width radius left
   an opaque wedge in every corner and never touched the straight edges at all,
   which is the black frame that kept showing up against the embers.          */
const SRC_W = 1053, SRC_H = 1494, MARGIN = 6;
const VIS_W = SRC_W - MARGIN * 2;              // 1041
const VIS_H = SRC_H - MARGIN * 2;              // 1482
const ASPECT = VIS_W / VIS_H;                  // 0.70243
const R_FRAC = 79 / VIS_W;                     // 0.07589

const VID_W = 1920, VID_H = 1080;
/* The card occupies 94% of the video's height, and that includes card.png's
   own 6px margins — so the *visible* card in video space is slightly shorter.
   The video is scaled to make this height match `card.h`, which is what keeps
   the hand-off from jumping. */
const CARD_IN_VID_H = 0.94 * VID_H * (VIS_H / SRC_H);   // 1007.05

const PLAYBACK = 0.75;                         // intro speed
const NAME = 'Nimit Limbachiya';
const GOLD = 'rgb(255,175,95)';                 // the flat gold shards fly as

/* The wordmark's gold, lifted from the hero design: a seven-stop gradient that
   starts and ends on the same colour so it can be sampled as a loop, and swept
   across the name on a 14s cycle for the sheen. Baked to a lookup table once,
   so animating it costs a handful of colour reads per frame instead of a
   gradient object. */
const GOLD_STOPS = [
  [0.00, 0x8f, 0x6a, 0x22], [0.18, 0xd8, 0xab, 0x45], [0.34, 0xfd, 0xf0, 0xc0],
  [0.50, 0xe0, 0xb7, 0x4f], [0.68, 0xa9, 0x7a, 0x24], [0.86, 0xf6, 0xdd, 0x94],
  [1.00, 0x8f, 0x6a, 0x22],
];
const LUT_N = 128, NAME_BANDS = 16, SHEEN_SEC = 14;
const goldLUT = (() => {
  const t = new Array(LUT_N);
  for (let i = 0; i < LUT_N; i++) {
    const u = i / LUT_N;
    let k = 0;
    while (k < GOLD_STOPS.length - 2 && u > GOLD_STOPS[k + 1][0]) k++;
    const a = GOLD_STOPS[k], b = GOLD_STOPS[k + 1];
    const f = (u - a[0]) / (b[0] - a[0]);
    t[i] = [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f];
  }
  return t;
})();

let W = 0, H = 0, dpr = 1, mx = 0.5, my = 0.5, portrait = false;
let card = { x: 0, y: 0, w: 0, h: 0 };
let cell = 4, nameFs = 64;

const img = new Image();

/* Deterministic RNG: a resize rebuilds every particle, and reseeding from the
   same value keeps the dust from visibly re-rolling mid-dissolve. */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

function layoutCard() {
  /* Sized from the viewport, not from the video's letterbox scale. The old
     `min(W/1920, H/1080)` collapsed the card to ~145x206 on a phone. */
  const maxH = H * (portrait ? 0.70 : 0.94);
  const maxW = W * (portrait ? 0.88 : 0.92);
  let h = maxH, w = h * ASPECT;
  if (w > maxW) { w = maxW; h = w / ASPECT; }
  card = { x: (W - w) / 2, y: (H - h) / 2, w, h };
}

    if (grp.items.length > maxG) maxG = grp.items.length;
    /* A shard's alpha step encodes exactly how far along its flight it is, and
       that mapping never changes — so the colour ramp from card paint to ember
       gold can be baked per step at build time. The dissolve then costs no
       string building at all, and a shard is already gold by the time it is
       fully detached, which is what lets the reassembly pick it up seamlessly. */
    grp.stepCss = new Array(ASTEPS);
    for (let s = 0; s < ASTEPS; s++) {
      const a = s / (ASTEPS - 1);
      const l = Math.min(1, Math.max(0, (1 - a) / FADE_SPAN));
      const m = smooth(0.2, 1, l);
      grp.stepCss[s] = `rgb(${Math.round(grp.r + (255 - grp.r) * m)},`
        + `${Math.round(grp.g + (175 - grp.g) * m)},`
        + `${Math.round(grp.b + (95 - grp.b) * m)})`;
    }
  }
  /* Scratch buffers for batched drawing, reused every frame so the hot loop
     allocates nothing. Measured: ~27.7k individual fillRect calls with a
     per-particle globalAlpha costs 8.6ms/frame; collecting them into one path
     per (colour, alpha) bucket and filling that costs 3.9ms. */
  scratch = [];
  for (let s = 0; s < ASTEPS; s++) scratch.push(new Float32Array(Math.max(3, maxG * 3)));

  /* Split the name's shards into vertical bands so the gradient and its sheen
     can be applied with one fill per band rather than per shard. */
  nameBands = Array.from({ length: NAME_BANDS }, () => []);
  for (const p of particles) {
    if (p.tx == null) continue;
    const u = (p.tx - nameLeft) / nameW;
    const b = Math.min(NAME_BANDS - 1, Math.max(0, Math.floor(u * NAME_BANDS)));
    nameBands[b].push(p);
  }
  return true;
}

/* --------------------------------------------------------------- ember world */
let embers = [], ash = [], grainPat = null, bgGrad = null;
let grainOx = 0, grainOy = 0, grainAt = 0;

function buildBg() {
  const rnd = mulberry32(0x1F0E5A11);
  const scale = REDUCED ? 0.34 : 1;
  embers = []; ash = [];
  const ne = Math.round(W * H / 20000 * scale), na = Math.round(W * H / 45000 * scale);
  for (let k = 0; k < ne; k++) embers.push({
    x: rnd() * W, y: rnd() * H, r: rnd() * 1.6 + 0.6,
    vy: rnd() * 0.8 + 0.3, ph: rnd() * 6.28, bright: rnd() < 0.25, z: rnd(),
  });
  for (let k = 0; k < na; k++) ash.push({
    x: rnd() * W, y: rnd() * H, r: rnd() * 1.1 + 0.5, vy: rnd() * 0.35 + 0.15, ph: rnd() * 6.28,
  });

  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#221a13'); bgGrad.addColorStop(1, '#0b0806');

  // one cached pattern instead of ~200 drawImage tiles per frame
  const n = document.createElement('canvas'); n.width = n.height = 140;
  const nx = n.getContext('2d'), id = nx.createImageData(140, 140);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = (rnd() * 255) | 0;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  nx.putImageData(id, 0, 0);
  grainPat = ctx.createPattern(n, 'repeat');
}

/* Smooth value noise on a grid, bilinear with a smoothstep fade. Used for two
   things that both want blobs rather than static: the ragged edge the fire eats
   along, and the vein pattern the lava glows through. */
function valueNoise(w, h, cx, cy, rnd) {
  const gw = cx + 1, g = new Float32Array(gw * (cy + 1));
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  const out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const fy = y / h * cy, y0 = Math.min(cy - 1, fy | 0), ty = fy - y0;
    const sy = ty * ty * (3 - 2 * ty);
    for (let x = 0; x < w; x++) {
      const fx = x / w * cx, x0 = Math.min(cx - 1, fx | 0), tx = fx - x0;
      const sx = tx * tx * (3 - 2 * tx);
      const i0 = y0 * gw + x0, i1 = i0 + gw;
      const a = g[i0] + (g[i0 + 1] - g[i0]) * sx;
      const b = g[i1] + (g[i1 + 1] - g[i1]) * sx;
      out[y * w + x] = a + (b - a) * sy;
    }
  }
  return out;
}

function octaves(w, h, cx, cy, rnd) {
  const a = valueNoise(w, h, cx, cy, rnd);
  const b = valueNoise(w, h, cx * 2 + 1, cy * 2 + 1, rnd);
  const c = valueNoise(w, h, cx * 4 + 1, cy * 4 + 1, rnd);
  for (let i = 0; i < a.length; i++) a[i] = a[i] * 0.5 + b[i] * 0.32 + c[i] * 0.18;
  return a;
}

/* --------------------------------------------------------------------- lava
   The world the card burned in was embers over near-black. As the name goes up,
   it turns molten -- but molten rock is mostly dark: a black crust with light
   coming up through the cracks in it, and only near the bottom of the frame,
   where the fire used to stand. So the veins are thin rather than broad, and the
   whole field is weighted hard toward the foot; a bright, even wash across the
   frame reads as coloured fog and takes the type down with it.

   A vein is a ridge of value noise -- the set of points where the field crosses
   its own midline, raised to a high power so only the crossing itself survives.
   Two octaves: enough for the line to wander, few enough that it stays a line
   and doesn't break into islands. A third field varies the heat along it, so
   some cracks glow and others have gone dark. */
let lavaTex = null;

/* the ember background's stops, and where they end up once everything is lava */
const BG_COOL = [[0, 34, 26, 19], [0.62, 21, 16, 12], [1, 11, 8, 6]];
const BG_LAVA = [[0, 26, 8, 4], [0.62, 43, 12, 4], [1, 78, 20, 4]];

function buildLava() {
  const w = Math.max(48, Math.min(640, Math.round(W * 0.45)));
  const h = Math.max(48, Math.round(w * H / W));
  /* Cell counts derived from the viewport rather than fixed, so a crack is about
     as wide as it is tall on any shape of screen. A fixed count stretches into
     vertical streaks on a phone, which reads as a curtain rather than a crust. */
  const cell = Math.min(W, H) / 7;
  const cx = Math.max(3, Math.round(W / cell)), cy = Math.max(3, Math.round(H / cell));
  const rnd = mulberry32(0x0FA5EDA1);
  const a = valueNoise(w, h, cx, cy, rnd);
  const b = valueNoise(w, h, cx * 2 + 1, cy * 2 + 1, rnd);
  const heat = valueNoise(w, h, Math.max(2, cx >> 1), Math.max(2, cy >> 1), rnd);

  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx2 = c.getContext('2d'), id = cx2.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    /* The crust is coldest at the top and molten at the foot, but it never goes
       fully out: a floor under the ramp keeps veins running all the way into the
       top corners. A pure power curve left them dead black, and dead black
       corners make the frame read as a vignette rather than as a world. */
    const ramp = 0.12 + 0.88 * Math.pow(y / (h - 1), 2.2);
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const f = a[i] * 0.68 + b[i] * 0.32;
      const ridge = Math.pow(1 - Math.abs(2 * f - 1), 17);
      const v = Math.min(1, ridge * ramp * (0.35 + 1.3 * heat[i]));
      const j = i * 4;
      id.data[j] = 255;
      id.data[j + 1] = 60 + 130 * v;
      id.data[j + 2] = 8 + 90 * v * v * v;
      id.data[j + 3] = Math.round(255 * Math.min(1, v * 1.2));
    }
  }
  cx2.putImageData(id, 0, 0);
  lavaTex = c;
}

/* ------------------------------------------------------------------ flame
   A golden flame at the foot of the frame, which the embers now rise out of --
   until now they drifted up from nothing. One teardrop sprite is rendered once
   and stamped a dozen times per frame at wobbling sizes, so the whole thing
   costs a handful of drawImage calls rather than a gradient per tongue. */
let flameSprite = null, tongues = [];

function buildFlame() {
  if (!flameSprite) {
    const SW = 160, SH = 400;
    flameSprite = document.createElement('canvas');
    flameSprite.width = SW; flameSprite.height = SH;
    const fx = flameSprite.getContext('2d');
    const id = fx.createImageData(SW, SH);
    for (let y = 0; y < SH; y++) {
      const u = y / SH;                       // 0 at the tip, 1 at the base
      // blunt, not triangular — a sharp taper reads as a candle, not a fire
      const hw = (SW / 2) * Math.pow(u, 0.42) * (1 - 0.06 * u);
      const body = Math.pow(u, 0.42) * Math.min(1, u / 0.06);
      if (hw <= 0.01) continue;
      for (let x = 0; x < SW; x++) {
        const r = Math.abs(x - SW / 2) / hw;
        if (r >= 1) continue;
        // soft shoulder so overlapping tongues merge into one body
        const a = Math.pow(1 - r * r, 1.15);
        const i = (y * SW + x) * 4;
        id.data[i] = 205 + 50 * a;                    // hot core -> amber edge
        id.data[i + 1] = 95 + 140 * a * a;
        id.data[i + 2] = 25 + 165 * Math.pow(a, 4);
        id.data[i + 3] = Math.round(235 * a * body);
      }
    }
    fx.putImageData(id, 0, 0);
  }
  /* A wide low bed plus two broad swells give the fire a single body; the licks
     on top are clustered toward the middle by a triangular distribution, so it
     reads as one flame rather than a row of them. */
  const rnd = mulberry32(0x9E3779B9);
  tongues = [
    { x: 0, w: 1.5, h: 0.30, sp: 0.55, ph: 0.0, a: 0.42 },
    { x: 0, w: 0.85, h: 0.62, sp: 0.70, ph: 1.3, a: 0.34 },
    { x: 0, w: 0.50, h: 0.95, sp: 0.85, ph: 2.1, a: 0.30 },
  ];
  for (let k = 0, n = REDUCED ? 4 : 9; k < n; k++) tongues.push({
    x: (rnd() + rnd() - 1) * 0.5, w: 0.16 + rnd() * 0.26, h: 0.45 + rnd() * 0.75,
    sp: 1.0 + rnd() * 1.8, ph: rnd() * 6.28, a: 0.16 + rnd() * 0.24,
  });
}

/* Ignition. The flame does not exist during the intro — it catches only once the
   video has handed over and the card can be scrolled, then climbs from nothing
   over a few seconds rather than appearing already burning. `flameNow` folds in
   its death: once the name takes light the fire at the foot of the frame goes
   out, having handed the burning over. */
let flameLit = 0, flameNow = 0;
const FLAME_IGNITE = 4.5;                        // seconds from spark to full height

function drawFlame(t, prog) {
  if (!flameSprite || flameNow <= 0.002) return;
  const lit = flameNow;
  const fw = W * 0.40, fh = H * 0.46, cx = W / 2, baseY = H + fh * 0.04;
  // grows as it catches, then again as the card goes
  const boost = lit * (1 + 0.45 * smooth(0, 0.3, prog));
  /* Brightness runs ahead of height, so it reads as a small flame taking hold
     and climbing rather than a dim smear slowly resolving into fire. */
  const fade = Math.pow(lit, 0.4);
  const damp = REDUCED ? 0.35 : 1;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < tongues.length; i++) {
    const q = tongues[i];
    const flick = 0.72 + damp * (0.28 * Math.sin(t * q.sp + q.ph) + 0.14 * Math.sin(t * q.sp * 2.7 + q.ph * 1.9));
    const h = fh * q.h * flick * boost;
    const w = fw * q.w * (0.90 + damp * 0.14 * Math.sin(t * q.sp * 1.6 + q.ph));
    const x = cx + q.x * fw + damp * Math.sin(t * 0.7 + q.ph) * fw * 0.05;
    ctx.globalAlpha = q.a * (0.74 + 0.26 * flick) * fade;
    ctx.drawImage(flameSprite, x - w / 2, baseY - h, w, h);
  }
  ctx.globalAlpha = 1;
  const bl = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, fw * 0.95 * (0.4 + 0.6 * lit));
  bl.addColorStop(0, `rgba(255,150,60,${0.26 * boost})`); bl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bl; ctx.fillRect(0, H - fh * 1.7, W, fh * 1.7 + 2);
  ctx.globalCompositeOperation = 'source-over';
}

function drawBackground(t, dt) {
  /* Acts 1 and 2 keep the cached gradient; only once the world starts going
     molten is one built per frame, and it is three stops, so that is cheap. */
  if (lava <= 0) {
    ctx.fillStyle = bgGrad;
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    for (let i = 0; i < BG_COOL.length; i++) {
      const a = BG_COOL[i], b = BG_LAVA[i];
      g.addColorStop(a[0], `rgb(${Math.round(a[1] + (b[1] - a[1]) * lava)},`
        + `${Math.round(a[2] + (b[2] - a[2]) * lava)},`
        + `${Math.round(a[3] + (b[3] - a[3]) * lava)})`);
    }
    ctx.fillStyle = g;
  }
  ctx.fillRect(0, 0, W, H);

  const gx = W * (0.5 + 0.1 * Math.cos(t * 0.15)), gy = H * 0.98;
  const bloom = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.72);
  bloom.addColorStop(0, `rgba(${200 + 55 * lava | 0},${120 - 26 * lava | 0},`
    + `${55 - 26 * lava | 0},${0.24 + 0.16 * lava})`);
  bloom.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bloom; ctx.fillRect(0, 0, W, H);

  if (lava > 0.01 && lavaTex) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.34 * lava * (REDUCED ? 1 : 0.86 + 0.14 * Math.sin(t * 0.42));
    ctx.drawImage(lavaTex, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  const lx = mx * W, ly = my * H;
  const cl = ctx.createRadialGradient(lx, ly, 0, lx, ly, Math.min(W, H) * 0.45);
  cl.addColorStop(0, 'rgba(255,170,80,0.10)'); cl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = cl; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  drawFlame(t, prog);

  const drift = REDUCED ? 0.18 : 1;
  const k = dt * 60;
  ctx.fillStyle = 'rgba(160,160,170,0.12)';
  for (const a of ash) {
    a.y -= a.vy * k * drift; a.ph += 0.02 * k;
    if (a.y < -4) { a.y = H + 4; a.x = Math.random() * W; }
    ctx.beginPath(); ctx.arc(a.x + Math.sin(a.ph) * 8, a.y, a.r, 0, 6.2832); ctx.fill();
  }

  ctx.globalCompositeOperation = 'lighter';
  const px = (mx - 0.5) * 30;
  for (const e of embers) {
    e.y -= e.vy * k * drift; e.ph += 0.05 * k;
    // most embers are reborn in the flame, the rest anywhere, so the fire reads
    // as their source without the field looking like it all funnels through it
    if (e.y < -6) {
      e.y = H + 6;
      e.x = Math.random() < 0.62 * flameNow
        ? W / 2 + (Math.random() - 0.5) * W * 0.5
        : Math.random() * W;
    }
    const x = e.x + Math.sin(e.ph) * 10 + px * (0.3 + e.z);
    const flick = 0.45 + 0.55 * Math.sin(t * 3 + e.ph * 3);
    const col = e.bright ? '255,205,120' : '255,150,70';
    ctx.beginPath(); ctx.arc(x, e.y, e.r * 3.2, 0, 6.2832);
    ctx.fillStyle = `rgba(${col},${0.13 * flick})`; ctx.fill();
    ctx.beginPath(); ctx.arc(x, e.y, e.r, 0, 6.2832);
    ctx.fillStyle = `rgba(${col},${(e.bright ? 0.9 : 0.6) * flick})`; ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ------------------------------------------------------------------ cursor
   A dot that sits exactly under the pointer and a ring that follows it a beat
   behind, widening as it hurries to catch up. The split is what gives it the
   feel: the dot means the site is still precise about where you are, and the
   ring is the only part allowed to have weight.

   The native cursor is hidden as soon as the script knows there is a mouse, but
   the replacement stays invisible until the pointer actually moves — so nothing
   sits over the opening video for a reader who has not touched the mouse yet,
   which is where the stray default arrow was showing up. */
const curDot = document.getElementById('curDot');
const curRing = document.getElementById('curRing');
let curX = 0, curY = 0, curLive = false;

const CUR_OK = !REDUCED && matchMedia('(hover: hover) and (pointer: fine)').matches;
if (CUR_OK) document.documentElement.classList.add('nocur');

function moveCursor(dt) {
  if (!curLive) return;
  const tx = mx * W, ty = my * H;
  // frame-rate independent, and damped hard enough that it never overshoots
  const k = 1 - Math.exp(-13 * dt);
  curX += (tx - curX) * k; curY += (ty - curY) * k;
  const dx = tx - curX, dy = ty - curY;
  const lag = Math.min(1, Math.sqrt(dx * dx + dy * dy) / 90);
  curDot.style.transform = `translate3d(${tx}px,${ty}px,0)`;
  curRing.style.transform = `translate3d(${curX}px,${curY}px,0) scale(${1 + 0.55 * lag})`;
}

function post(now) {
  if (grainPat) {
    // real film grain resamples ~12x a second, not every frame
    if (!REDUCED && now - grainAt > 80) {
      grainOx = (Math.random() * 140) | 0; grainOy = (Math.random() * 140) | 0; grainAt = now;
    }
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.translate(-grainOx, -grainOy);
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W + 140, H + 140);
    ctx.restore();
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.82);
  /* Eased *off* as the world goes molten. At full strength it crushed the vein
     field to black in the corners, and a frame whose corners are empty reads as
     a vignette rather than as somewhere the light happens to be dimmer. */
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${0.55 - 0.12 * lava})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ------------------------------------------------------------ video texture
   The video used to sit in its own DOM layer above the canvas. Browsers
   composite video separately, with its own colour management, which is what
   made the hand-off pulse — and the ember background met the matte's edge with
   nothing bridging them. Drawing it into the canvas puts both through one
   pipeline: one bloom, one grain, one vignette, and a feathered left/right edge
   that dissolves the seam into the embers. */
let vidLayer = null, vctx = null, feather = null, vidRect = { x: 0, y: 0, w: 0, h: 0 };

function buildVidLayer() {
  const s = card.h / CARD_IN_VID_H;
  const vw = VID_W * s, vh = VID_H * s;
  vidRect = { x: (W - vw) / 2, y: (H - vh) / 2, w: vw, h: vh };

  const pw = Math.max(2, Math.ceil(vw * dpr)), ph = Math.max(2, Math.ceil(vh * dpr));
  vidLayer = document.createElement('canvas'); vidLayer.width = pw; vidLayer.height = ph;
  vctx = vidLayer.getContext('2d');

  /* Feather the left and right edges only. Top and bottom are left hard on
     purpose: the card fills 94% of the video's height, so a vertical feather
     would eat into the card's own top and bottom edge. */
  feather = document.createElement('canvas'); feather.width = pw; feather.height = ph;
  const f = feather.getContext('2d');
  f.fillStyle = '#fff'; f.fillRect(0, 0, pw, ph);
  f.globalCompositeOperation = 'destination-out';
  const fw = pw * 0.06;
  let g = f.createLinearGradient(0, 0, fw, 0);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = g; f.fillRect(0, 0, fw, ph);
  g = f.createLinearGradient(pw, 0, pw - fw, 0);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  f.fillStyle = g; f.fillRect(pw - fw, 0, fw, ph);
}

function drawVideo(alpha) {
  if (!vidLayer || vid.readyState < 2) return false;
  vctx.clearRect(0, 0, vidLayer.width, vidLayer.height);
  vctx.drawImage(vid, 0, 0, vidLayer.width, vidLayer.height);
  vctx.globalCompositeOperation = 'destination-in';
  vctx.drawImage(feather, 0, 0);
  vctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  ctx.drawImage(vidLayer, vidRect.x, vidRect.y, vidRect.w, vidRect.h);
  ctx.globalAlpha = 1;
  return true;
}

/* ------------------------------------------------------- card + reassembly */
function drawCard(alpha) {
  if (!cardCanvas) return;
  ctx.globalAlpha = alpha;
  ctx.drawImage(cardCanvas, card.x, card.y, card.w, card.h);
  ctx.globalAlpha = 1;
}

/* Canvas entrance, used when the video can't be composited (Safari) or fails. */
function drawEntrance(e) {
  if (!cardCanvas) return;
  const k = 1 - Math.pow(1 - e, 3);
  const s = 1.16 - 0.16 * k;
  ctx.save();
  ctx.translate(W / 2, H / 2 + (1 - k) * H * 0.05);
  ctx.rotate((1 - k) * -0.07);
  ctx.scale(s, s);
  ctx.globalAlpha = Math.min(1, e * 2.4);
  ctx.drawImage(cardCanvas, -card.w / 2, -card.h / 2, card.w, card.h);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* Shards burst outward from the card's own centre and drift up a little, rather
   than all travelling the same way. The old motion carried them up by 0.55-1.25
   card heights, which on any normal viewport is straight off the top edge -- so
   by the midpoint the screen really was empty. Spreading sideways instead keeps
   the cloud in frame, which matters now that the same shards have to gather. */
function dirX(q) { return (q.hx / cardLayer.width) * 2 - 1; }
function dirY(q) { return (q.hy / cardLayer.height) * 2 - 1; }

/* Where a shard sits at the top of its burst, before it turns and gathers. The
   dissolve eases into this and the reassembly departs from it, so the two have
   to agree exactly — hence one place that computes it.

   Sideways it explodes; vertically it holds the card's own height exactly — a
   shard ends up level with the row it came from. The card already stands 94% of
   the viewport tall, so its top edge is within 30px of the browser chrome, and
   any vertical *spread* at all put the top of the cloud off the screen. Keeping
   the height rather than growing it is what fixed that. */
function burstX(q, t) {
  return card.x + q.hx * (card.w / cardLayer.width)
    + dirX(q) * card.w * 0.55 + (q.sp - 0.5) * 150 + Math.sin(t * 1.6 + q.ph) * 20;
}
function burstY(q, t) {
  return card.y + q.hy * (card.w / cardLayer.width)
    + Math.cos(t * 1.3 + q.ph) * 14;
}

/* The dust spells the name, then resolves into the real letterforms. Drawing the
   baked outlines rather than leaving it as particles is what stops the wordmark
   reading as pixelated at rest. The gradient is built from the same lookup table
   the dust bands use, in font units so it rides the path's own transform. */
/* The sheen, as a gradient in font units spanning x0..x1. Shared by every piece
   of type on the page, so the survivor carries the same sweep out of the burn
   that the whole wordmark had going in. */
function goldGrad(c, t, x0, x1) {
  const phase = (t / SHEEN_SEC) * LUT_N;
  const g = c.createLinearGradient(x0, 0, x1, 0);
  const STOPS = 24;
  for (let i = 0; i <= STOPS; i++) {
    const u = i / STOPS;
    const k = goldLUT[(((phase + u * (LUT_N / 2)) | 0) % LUT_N + LUT_N) % LUT_N];
    g.addColorStop(u, `rgb(${k[0] | 0},${k[1] | 0},${k[2] | 0})`);
  }
  return g;
}

/* Only the offset lives in coordinate space. Browsers apply `shadowBlur` in
   device pixels whatever the transform is -- so it has to be the same number
   from every call site, and `u` (font units to the caller's own space, 1 under a
   font-unit transform) applies to the offset alone. Scaling both, which reads as
   the obvious thing to do, gives the wordmark a tight bright halo when it is
   stamped as a bitmap and a wide soft one when it is filled as a path. */
function typeGlow(c, u) {
  c.shadowColor = 'rgba(255,160,60,0.34)';
  c.shadowBlur = 260;
  c.shadowOffsetY = 80 * u;
}

/* Act 2's wordmark goes through act 3's renderer with the fire set to "not yet".
   Filling the two words separately is not quite the same as filling them as one
   path -- the rasteriser computes coverage per fill, and the edges land a little
   differently even though the two words never touch -- and act 3 has no choice
   but to fill them separately, because the fire only takes one of them. Drawing
   act 2 any other way puts a seam on the frame the fire arrives. */
function drawSolidName(alpha, t) { drawWordmark(t, -PRE, alpha); }

function drawParticles(prog, t) {
  if (!cardCanvas) return;
  if (prog <= 0.004) { drawCard(1); return; }

  const dp = Math.min(1, prog / 0.5), rp = Math.max(0, (prog - 0.5) / 0.5);
  const win = 0.3, sc = card.w / cardLayer.width;

  if (rp <= 0) {
    /* Incremental erase. This used to clear the layer and re-fill every one of
       ~28k cells on every frame; now it only stamps the cells that just crossed
       their threshold, and only rebuilds from scratch when scrubbed backwards. */
    if (dp < lastDp) {
      lctx.clearRect(0, 0, cardLayer.width, cardLayer.height);
      lctx.drawImage(cardCanvas, 0, 0);
      erasePtr = 0;
    }
    if (lastDp < 0) { lctx.clearRect(0, 0, cardLayer.width, cardLayer.height); lctx.drawImage(cardCanvas, 0, 0); }
    lctx.globalCompositeOperation = 'destination-out';
    /* Integer-aligned and overlapping by 1px: destination-out then covers whole
       pixels, so re-stamping a cell is idempotent. With half-pixel offsets a
       scrub back through the reassembly range re-erased every antialiased cell
       boundary a second time and softened the dissolve edges. */
    while (erasePtr < eraseCells.length && eraseCells[erasePtr].delay < dp) {
      const q = eraseCells[erasePtr++];
      lctx.fillRect(q.hx - 1, q.hy - 1, cell + 2, cell + 2);
    }
    lctx.globalCompositeOperation = 'source-over';
    lastDp = dp;
    ctx.drawImage(cardLayer, card.x, card.y, card.w, card.h);
  } else {
    lastDp = dp;
  }

  /* The dust is on its targets by rp 0.72, and only then does the type come up
     underneath it. Gathering all the way to rp 1 and crossfading from rp 0.48
     meant the letterforms were resolving while the shards were still converging
     on them — so what you saw was type appearing inside a cloud, rather than a
     name spelled in dust that then hardens. */
  const te = smooth(0, 0.72, rp);
  const solid = smooth(0.88, 1, prog);          // dust resolves into real letterforms
  const baseSz = cell * sc;
  /* Laid down before the dust, not after. Drawn on top it replaced the additive
     grains with partly-transparent type and the name visibly sagged in
     brightness mid-crossfade; underneath, the dust simply settles onto letters
     that are already forming. */
  drawSolidName(solid, t);
  ctx.globalCompositeOperation = 'lighter';

  if (rp <= 0) {
    for (const grp of colGroups) {
      const items = grp.items;
      scratchN.fill(0);
      for (let i = 0; i < items.length; i++) {
        const q = items[i];
        const lp = (dp - q.delay) / win;
        if (lp <= 0) break;                     // sorted by delay — rest are dormant
        const l = lp > 1 ? 1 : lp;
        const e = l * l;
        const hx = card.x + q.hx * sc, hy = card.y + q.hy * sc;
        const x = hx + (burstX(q, t) - hx) * e;
        const y = hy + (burstY(q, t) - hy) * e;
        /* Dims towards DUST_FLOOR rather than to nothing. Previously a shard hit
           zero alpha the moment it was fully detached, so the screen emptied and
           the name was then assembled by shards that appeared from nowhere. */
        const s = Math.round((1 - FADE_SPAN * l) * (ASTEPS - 1));
        const buf = scratch[s]; const n = scratchN[s];
        buf[n] = x; buf[n + 1] = y;
        buf[n + 2] = DUST_SZ + (baseSz - DUST_SZ) * Math.max(0, 1 - l / 0.16);
        scratchN[s] = n + 3;
      }
      for (let s = 1; s < ASTEPS; s++) {
        const n = scratchN[s];
        if (!n) continue;
        ctx.globalAlpha = s / (ASTEPS - 1);
        ctx.fillStyle = grp.stepCss[s];
        const buf = scratch[s];
        ctx.beginPath();
        for (let i = 0; i < n; i += 3) ctx.rect(buf[i], buf[i + 1], buf[i + 2], buf[i + 2]);
        ctx.fill();
      }
    }
  } else {
    /* Reassembly: alpha is uniform across each band, so each is a single path
       and a single fill. Every value here starts exactly where the dissolve left
       off (alpha DUST_FLOOR, size DUST_SZ, already gold) so the same shards
       simply change direction and gather instead of being replaced. */
    // starts at exactly what the dissolve ended on, then thins onto the letterforms
    const sz = DUST_SZ * (1 - (1 - RE_SZ) * te);
    const drawTo = (list, css, alpha) => {
      if (alpha <= 0.004 || !list.length) return;
      ctx.fillStyle = css; ctx.globalAlpha = alpha;
      ctx.beginPath();
      for (let i = 0; i < list.length; i++) {
        const q = list[i];
        const scx = burstX(q, t), scy = burstY(q, t);
        ctx.rect(scx + (q.tx - scx) * te, scy + (q.ty - scy) * te, sz, sz);
      }
      ctx.fill();
    };
    /* The dust reaches full strength early and then clears quickly, rather than
       still brightening while the type is already forming underneath. Measured
       across the hand-off, that keeps the wordmark's brightness rising to a
       small bloom and settling, instead of spiking and dipping. */
    const nameAlpha = (DUST_FLOOR + (1 - DUST_FLOOR) * Math.min(1, rp / 0.5))
      * Math.pow(1 - solid, 2);
    /* The gradient emerges as the shards gather: at rp 0 every band is the flat
       gold the dissolve ended on, so the hand-off stays seamless, and by the
       time the name is legible it carries the wordmark's full sweep. */
    const g = smooth(0, 0.45, rp);
    const phase = (t / SHEEN_SEC) * LUT_N;
    for (let i = 0; i < NAME_BANDS; i++) {
      const band = nameBands[i];
      if (!band || !band.length) continue;
      const c = goldLUT[(((phase + i * (LUT_N / 2 / NAME_BANDS)) | 0) % LUT_N + LUT_N) % LUT_N];
      const cr = Math.round(255 + (c[0] - 255) * g);
      const cg = Math.round(175 + (c[1] - 175) * g);
      const cb = Math.round(95 + (c[2] - 95) * g);
      drawTo(band, `rgb(${cr},${cg},${cb})`, nameAlpha);
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ------------------------------------------------------------------- act 3
   The fire at the foot of the frame goes out, having handed its burning to the
   name: the last name catches, chars, and leaves as ash, and the survivor glides
   into "Hi there, my name is Nimit" while the world behind it goes molten.

   Every value in this act is a function of `burn` alone -- nothing integrates
   over time -- so scrolling back up runs the fire backwards into the letterform
   rather than leaving a cloud of ash stranded in mid-air. */
const B_FIRE = 0.52;                  // burn at which the last name is fully spent
const CHAR = 0.17;                    // width of the charring band, in threshold units
const PRE = 0.11;                     // how far ahead of the front a letterform preheats
/* Three beats, barely overlapping. The name only moves once its other half is
   ash, and it has to finish moving before the sentence starts: the lead-in is
   written at the composition's centre, so while the survivor is still travelling
   the two are visibly out of line with each other. */
const B_GLIDE0 = B_FIRE, B_GLIDE1 = 0.72;
const B_LEAD0 = 0.66, B_LEAD1 = 0.82;
/* A deliberate gap of scroll between the greeting settling and the aside
   arriving. The line is a punchline, and a punchline needs the pause. */
const B_NOTE0 = 0.90, B_NOTE1 = 1.25;
const ASH_LIFE = 0.62;
const BURN_PAD = 70;                  // font units of slack around the last name's box

const burnFront = (b) => -PRE + b / B_FIRE * (1 + CHAR + PRE);

let burnW = 0, burnH = 0, burnTh = null, burnAt = -99;
let maskCv = null, mctx = null, maskId = null;
let charCv = null, cctx = null, charId = null;
let nmLayer = null, nctx = null, nmXf = null, nmRect = null, nmDev = null;
let glowLo = null, gctx = null;
let ashPts = [], ashBuf = [];
const ASH_STEPS = 12;
const ashN = new Int32Array(ASH_STEPS);

/* When the fire reaches each point, as a number the advancing front is compared
   against. It starts at the inner end of the last name -- the end nearest the
   flame that lit it -- and runs outward and upward, roughened with noise so the
   edge tears along the letterforms instead of sweeping across them. */
function buildBurnField() {
  const s = nameEm(W, H) / NAME_UPEM;
  const bw = LAST_BOX.w + BURN_PAD * 2, bh = LAST_BOX.h + BURN_PAD * 2;
  /* At the name's own css resolution. Half of it was cheaper, but upscaling a
     hard 0/255 mask by four bled the tear into visible squares along the edge. */
  burnW = Math.max(64, Math.min(REDUCED ? 280 : 560, Math.round(bw * s)));
  burnH = Math.max(24, Math.round(burnW * bh / bw));

  const n = octaves(burnW, burnH, 9, 3, mulberry32(0x0B1A2E37));
  const A = 0.66, B = 0.22, C = 0.36;
  burnTh = new Float32Array(burnW * burnH);
  let lo = Infinity, hi = -Infinity;
  for (let y = 0; y < burnH; y++) {
    const v = Math.min(1, Math.max(0, ((y + 0.5) / burnH * bh - BURN_PAD) / LAST_BOX.h));
    for (let x = 0; x < burnW; x++) {
      const u = Math.min(1, Math.max(0, ((x + 0.5) / burnW * bw - BURN_PAD) / LAST_BOX.w));
      const i = y * burnW + x;
      const r = A * u + B * (1 - v) + C * n[i];
      burnTh[i] = r;
      if (r < lo) lo = r; if (r > hi) hi = r;
    }
  }
  /* Normalised against what the field actually holds rather than against the
     weights. Three octaves of value noise average toward the middle and never
     reach either end, so dividing by A+B+C leaves the last threshold around 0.87
     -- the fire would finish a good deal before the scroll position that is
     supposed to finish it, and the name would sit still waiting. */
  const span = 1 / Math.max(1e-6, hi - lo);
  for (let i = 0; i < burnTh.length; i++) burnTh[i] = (burnTh[i] - lo) * span;

  maskCv = document.createElement('canvas'); maskCv.width = burnW; maskCv.height = burnH;
  mctx = maskCv.getContext('2d'); maskId = mctx.createImageData(burnW, burnH);
  charCv = document.createElement('canvas'); charCv.width = burnW; charCv.height = burnH;
  cctx = charCv.getContext('2d'); charId = cctx.createImageData(burnW, burnH);
  // only the mask's alpha is ever read; keep it white so it is legible in a dump
  for (let i = 0; i < maskId.data.length; i += 4) {
    maskId.data[i] = maskId.data[i + 1] = maskId.data[i + 2] = 255;
  }
  burnAt = -99;
}

/* While the fire is burning, the whole wordmark is composed on one layer and
   stamped once. It would be cheaper to leave the untouched first name on the
   stage and only route the burning half through a layer -- but each shadowed
   draw casts its own glow, and two of them composite visibly warmer than the one
   act 2 casts from the wordmark's union silhouette. The name would brighten on
   the frame the fire arrives. One silhouette, one glow, no join.

   The layer's device-pixel origin is snapped to a whole pixel and the remainder
   folded into its own transform, so the glyphs land on exactly the sub-pixel
   phase they would have had drawn straight to the stage. */
let lastIn = null, lastRect = null;

function buildBurnLayer() {
  const s = nameEm(W, H) / NAME_UPEM, k = dpr * s;
  const Tx = dpr * (W / 2 - NAME_CX * s), Ty = dpr * (H / 2 - NAME_CY * s);
  const X = Math.floor(Tx + k * (NAME_BOX.x - BURN_PAD));
  const Y = Math.floor(Ty + k * (NAME_BOX.y - BURN_PAD));
  const LW = Math.max(2, Math.ceil(Tx + k * (NAME_BOX.x + NAME_BOX.w + BURN_PAD)) - X);
  const LH = Math.max(2, Math.ceil(Ty + k * (NAME_BOX.y + NAME_BOX.h + BURN_PAD)) - Y);

  nmLayer = document.createElement('canvas'); nmLayer.width = LW; nmLayer.height = LH;
  nctx = nmLayer.getContext('2d');
  nmXf = [k, 0, 0, k, Tx - X, Ty - Y];
  /* Kept in device pixels, and stamped with the transform reset, so the blit is
     one to one. Going through css coordinates means X/dpr*dpr, which for dpr 1.5
     lands a fraction of a pixel off — enough for the browser to resample, and
     every glyph edge in the wordmark softens on the frame act 3 takes over. */
  nmDev = { x: X, y: Y };
  nmRect = { x: X / dpr, y: Y / dpr, w: LW / dpr, h: LH / dpr };

  // where the last name's padded box falls inside that layer — the mask, the
  // char and the glow all address this sub-rectangle rather than the whole thing
  lastIn = {
    x: Tx + k * (LAST_BOX.x - BURN_PAD) - X,
    y: Ty + k * (LAST_BOX.y - BURN_PAD) - Y,
    w: k * (LAST_BOX.w + BURN_PAD * 2),
    h: k * (LAST_BOX.h + BURN_PAD * 2),
  };
  lastRect = {
    x: (X + lastIn.x) / dpr, y: (Y + lastIn.y) / dpr,
    w: lastIn.w / dpr, h: lastIn.h / dpr,
  };

  // the fire's glow is a downsample and a draw back up, which costs a fraction
  // of a real blur and is soft in the right way
  glowLo = document.createElement('canvas');
  glowLo.width = Math.max(2, lastIn.w / 6 | 0); glowLo.height = Math.max(2, lastIn.h / 6 | 0);
  gctx = glowLo.getContext('2d');
}

/* One flake per sampled point of the last name, carrying the threshold of the
   pixel it sits on -- so a flake lifts at the instant its own bit of letter is
   consumed, rather than being emitted near a moving line and hoping to match. */
function buildAsh() {
  ashPts = [];
  if (!lastPath || !burnTh || !lastRect) return;
  const bw = LAST_BOX.w + BURN_PAD * 2, k = burnW / bw;
  const o = document.createElement('canvas'); o.width = burnW; o.height = burnH;
  const c = o.getContext('2d');
  c.setTransform(k, 0, 0, k, -(LAST_BOX.x - BURN_PAD) * k, -(LAST_BOX.y - BURN_PAD) * k);
  c.fillStyle = '#fff'; c.fill(lastPath);
  const d = c.getImageData(0, 0, burnW, burnH).data;

  /* Every inked pixel of the field is a candidate and the list is then thinned
     to the count we want. Picking a stride up front instead needs a guess at how
     much of the box the glyphs cover, and the guess is what decides the flake
     count -- which is the one number that has to be right on every viewport. */
  const want = REDUCED ? 400 : 1500;
  const all = [];
  for (let i = 0; i < burnW * burnH; i++) if (d[i * 4 + 3] >= 110) all.push(i);
  const stride = Math.max(1, all.length / want);
  const rnd = mulberry32(0x1CE0A55E);
  for (let k = 0; k < all.length; k += stride) {
    const i = all[k | 0];
    ashPts.push({
      x: lastRect.x + (i % burnW + 0.5) / burnW * lastRect.w,
      y: lastRect.y + ((i / burnW) | 0) / burnH * lastRect.h,
      th: burnTh[i],
      r1: rnd(), r2: rnd(), r3: rnd(), r4: rnd(), ph: rnd() * 6.2832,
    });
  }
  ashBuf = [];
  for (let s = 0; s < ASH_STEPS; s++) ashBuf.push(new Float32Array(Math.max(3, ashPts.length * 3)));
}

/* Colour and alpha depend only on how far along a flake is, so the whole field
   batches into twelve fills: the first two additive, while a flake is still an
   ember, the rest plain grey once it has cooled to ash. */
const ashLook = Array.from({ length: ASH_STEPS }, (_, i) => {
  const a = (i + 0.5) / ASH_STEPS;
  const cool = smooth(0.08, 0.45, a);
  return {
    hot: a < 0.24,
    css: `rgb(${Math.round(255 - 125 * cool)},${Math.round(186 - 70 * cool)},${Math.round(120 - 8 * cool)})`,
    alpha: Math.min(1, a / 0.045) * Math.pow(1 - a, 1.1),
  };
});

/* Two buffers out of one pass over the field: what survives, and what is
   currently alight. Recomputed only when the front has actually moved, so a
   reader who stops scrolling pays nothing for it. */
function rasterBurn(front) {
  if (Math.abs(front - burnAt) < 0.0015) return;
  burnAt = front;
  const md = maskId.data, cd = charId.data;
  for (let i = 0, n = burnTh.length; i < n; i++) {
    const d = front - burnTh[i], j = i * 4;
    if (d <= -PRE) { md[j + 3] = 255; cd[j + 3] = 0; continue; }
    if (d >= CHAR) { md[j + 3] = 0; cd[j + 3] = 0; continue; }
    if (d < 0) {
      // preheat: the gold dulls and reddens just ahead of the fire reaching it
      const k = (d + PRE) / PRE;
      md[j + 3] = 255;
      cd[j] = 255; cd[j + 1] = 90 + 55 * (1 - k); cd[j + 2] = 30;
      cd[j + 3] = Math.round(150 * k * k);
      continue;
    }
    /* Behind the edge: a white-hot line, then orange, then char, and the
       letterform only gives way once it has gone dark. */
    const k = d / CHAR;
    cd[j] = k < 0.22 ? 255 : Math.round(255 - 210 * ((k - 0.22) / 0.78));
    cd[j + 1] = Math.round(235 * Math.pow(1 - k, 1.7));
    cd[j + 2] = Math.round(170 * Math.pow(1 - k, 4.5));
    cd[j + 3] = 255;
    md[j + 3] = k < 0.55 ? 255 : Math.round(255 * (1 - (k - 0.55) / 0.45));
  }
  mctx.putImageData(maskId, 0, 0);
  cctx.putImageData(charId, 0, 0);
}

/* The wordmark, at any point between whole and gone: the last name charred and
   eaten into by `front`, the first name untouched, composed on one layer and
   stamped once. Stamping once matters -- each shadowed draw casts its own glow,
   and two of them composite visibly warmer than one cast from the wordmark's
   union silhouette, so the name would brighten the moment the fire arrived. */
function drawWordmark(t, front, alpha) {
  if (!nmLayer || alpha <= 0.004) return;
  const em = nameEm(W, H), s = em / NAME_UPEM;
  const L = lastIn;
  const alight = front > -PRE;

  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.globalCompositeOperation = 'source-over';
  nctx.clearRect(0, 0, nmLayer.width, nmLayer.height);
  nctx.setTransform(nmXf[0], nmXf[1], nmXf[2], nmXf[3], nmXf[4], nmXf[5]);
  const gold = goldGrad(nctx, t, NAME_BOX.x, NAME_BOX.x + NAME_BOX.w);
  nctx.fillStyle = gold;
  nctx.fill(lastPath);
  if (alight) {
    rasterBurn(front);
    nctx.setTransform(1, 0, 0, 1, 0, 0);
    /* source-atop paints the char onto the letterform and leaves everything the
       char canvas does not touch alone; destination-in then takes away what is
       spent -- and takes away everything outside the last name's box too, which
       is why the first name goes on afterwards rather than before. The mask is
       scaled up from a smaller buffer, and the softness that introduces is the
       softness a charred edge has anyway. */
    nctx.globalCompositeOperation = 'source-atop';
    nctx.drawImage(charCv, L.x, L.y, L.w, L.h);
    nctx.globalCompositeOperation = 'destination-in';
    nctx.drawImage(maskCv, L.x, L.y, L.w, L.h);
    nctx.globalCompositeOperation = 'source-over';
    nctx.setTransform(nmXf[0], nmXf[1], nmXf[2], nmXf[3], nmXf[4], nmXf[5]);
    nctx.fillStyle = gold;
  }
  nctx.fill(firstPath);

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);            // device pixels, so the blit is 1:1
  ctx.globalAlpha = alpha;
  typeGlow(ctx, s * dpr);
  ctx.drawImage(nmLayer, nmDev.x, nmDev.y);
  ctx.restore();

  if (!alight) return;                           // nothing burning yet, so no glow
  const gw = glowLo.width, gh = glowLo.height;
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.globalCompositeOperation = 'source-over';
  gctx.clearRect(0, 0, gw, gh);
  gctx.drawImage(charCv, 0, 0, gw, gh);
  gctx.globalCompositeOperation = 'destination-in';   // only where letter survives
  gctx.drawImage(nmLayer, L.x, L.y, L.w, L.h, 0, 0, gw, gh);
  gctx.globalCompositeOperation = 'source-over';
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 2; i++) {
    const p = (i ? 0.10 : 0.035) * em;
    ctx.globalAlpha = i ? 0.32 : 0.55;
    ctx.drawImage(glowLo, lastRect.x - p, lastRect.y - p, lastRect.w + p * 2, lastRect.h + p * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawAsh(front, t) {
  if (!ashPts.length) return;
  ashN.fill(0);
  const rise = H * 0.34, drift = REDUCED ? 0.35 : 1;
  for (let i = 0; i < ashPts.length; i++) {
    const p = ashPts[i];
    const a = (front - p.th) / ASH_LIFE;
    if (a <= 0 || a >= 1) continue;
    const lift = Math.pow(a, 1.35) * rise * (0.45 + 0.95 * p.r1) * drift;
    const sway = (Math.sin(t * (0.6 + p.r2) + p.ph) * (5 + 20 * p.r2) + (p.r3 - 0.5) * 46) * a * drift;
    const s = (a * ASH_STEPS) | 0;
    const b = ashBuf[s], n = ashN[s];
    b[n] = p.x + sway; b[n + 1] = p.y - lift;
    b[n + 2] = (0.9 + 2.3 * p.r4) * (1 - 0.3 * a);
    ashN[s] = n + 3;
  }
  for (let s = 0; s < ASH_STEPS; s++) {
    const n = ashN[s];
    if (!n) continue;
    const look = ashLook[s], b = ashBuf[s];
    ctx.globalCompositeOperation = look.hot ? 'lighter' : 'source-over';
    ctx.globalAlpha = look.alpha;
    ctx.fillStyle = look.css;
    ctx.beginPath();
    for (let i = 0; i < n; i += 3) ctx.rect(b[i], b[i + 1], b[i + 2], b[i + 2]);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* The resting composition: the lead-in set over the surviving first name. On a
   phone the name has to claim far more of the width to stay legible, which is
   the same rule the card is laid out by. */
const LEAD_RATIO = 0.235, LEAD_GAP = 0.30, NOTE_GAP = 0.34;

/* The aside breaks to two lines when one would leave it too small to read. The
   threshold is on the *resulting type size*, not on `portrait` — a short wide
   window has the same problem a phone does. */
function finalLayout() {
  const en = Math.min(W * (portrait ? 0.66 : 0.46) / FIRST_ADV, H * 0.30);
  const el = Math.min(en * LEAD_RATIO, W * 0.80 / HI_ADV);

  const oneEm = Math.min(en * 0.215, W * 0.76 / NOTE_ADV);
  const twoLine = oneEm < 26;
  // as two lines it is the wider half that sets the size
  const halfAdv = Math.max(NOTE1_BOX.w, NOTE2_BOX.w) / NAME_UPEM;
  const nt = twoLine ? Math.min(en * 0.36, W * 0.84 / halfAdv) : oneEm;

  const hHi = HI_BOX.h / NAME_UPEM * el;
  const hNm = FIRST_BOX.h / NAME_UPEM * en;
  const lineH = NOTE_BOX.h / NAME_UPEM * nt;
  const hNt = twoLine ? lineH * 2 : lineH;
  const gap = LEAD_GAP * en, gap2 = NOTE_GAP * en;

  const top = H / 2 - (hHi + gap + hNm + gap2 + hNt) / 2;
  return {
    en, el, nt, twoLine, lineH,
    hiCy: top + hHi / 2,
    nmCy: top + hHi + gap + hNm / 2,
    ntTop: top + hHi + gap + hNm + gap2,
  };
}

/* "Nimit" is one outline the whole way through -- act 2's dust settles onto it,
   the fire takes its other half, and then it moves. Only a uniform scale and a
   translation separate where it starts from where it ends, so interpolating
   those three numbers is the real motion rather than an approximation of it. */
function drawSurvivor(k, t) {
  if (!firstPath) return;
  const s1 = nameEm(W, H) / NAME_UPEM;
  const L = finalLayout(), s2 = L.en / NAME_UPEM;
  const o1x = W / 2 - NAME_CX * s1, o1y = H / 2 - NAME_CY * s1;
  const s = s1 + (s2 - s1) * k;
  const ox = o1x + (W / 2 - FIRST_CX * s2 - o1x) * k;
  const oy = o1y + (L.nmCy - FIRST_CY * s2 - o1y) * k;
  ctx.save();
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  typeGlow(ctx, 1);
  /* The sheen spans the whole wordmark while the last name is still there and
     closes onto the survivor as it leaves, so the gradient never jumps. */
  const x1 = NAME_BOX.x + NAME_BOX.w;
  ctx.fillStyle = goldGrad(ctx, t, NAME_BOX.x, x1 + (FIRST_BOX.x + FIRST_BOX.w - x1) * k);
  ctx.fill(firstPath);
  ctx.restore();
}

/* The sentence is written on rather than faded in: a single gradient carries
   both the sweep of gold and the wipe that reveals it, running white-hot right
   at the edge -- so the fire that took the last name draws this one. */
function drawLeadIn(k, t) {
  if (!hiPath || k <= 0.002) return;
  const L = finalLayout(), s = L.el / NAME_UPEM;
  const EDGE = 0.16, wipe = k * (1 + EDGE + 0.09) - 0.09;
  const phase = (t / SHEEN_SEC) * LUT_N;
  ctx.save();
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (W / 2 - HI_CX * s),
    dpr * (L.hiCy + (1 - k) * L.el * 0.5 - HI_CY * s));
  const g = ctx.createLinearGradient(HI_BOX.x, 0, HI_BOX.x + HI_BOX.w, 0);
  const STOPS = 30;
  for (let i = 0; i <= STOPS; i++) {
    const u = i / STOPS;
    const a = Math.min(1, Math.max(0, (wipe - u) / EDGE));
    const hot = Math.max(0, 1 - Math.abs(wipe - u) / EDGE);
    const c = goldLUT[(((phase + u * (LUT_N / 2)) | 0) % LUT_N + LUT_N) % LUT_N];
    g.addColorStop(u, `rgba(${c[0] + (255 - c[0]) * hot | 0},`
      + `${c[1] + (214 - c[1]) * hot | 0},${c[2] + (150 - c[2]) * hot | 0},${a})`);
  }
  typeGlow(ctx, 1);
  ctx.fillStyle = g;
  ctx.fill(hiPath);
  ctx.restore();
}

/* The survivor is only lifted off the shared layer once the last name is spent,
   and the glide starts on exactly that frame -- so at the hand-off it is still
   sitting at act 2's position and size, and the two routes draw the same thing.
   Start it any earlier and the name would have to move while it is still on a
   layer sized to the wordmark, and it would clip against the edge. */
/* The aside, appearing as though it is being written. No pen and no hand are
   drawn — the illusion is entirely in the face and in the order: a pen hand,
   revealed left to right along a *slanted* edge that follows the stroke angle,
   so an ascender arrives a moment after the stem it grows from. A vertical edge
   uncovers the top and bottom of a letter at once, which reads as a wipe.

   Deliberately not the fire-wipe the lead-in uses. That one is grand, and grand
   is the thing this line is undercutting: it just appears, quietly, in ink
   rather than gold, a beat after everything else has settled. */
function drawNote(k, t) {
  if (!note1Path || k <= 0.002) return;
  const L = finalLayout(), s = L.nt / NAME_UPEM;
  const EDGE = 0.055, wipe = k * (1 + 2 * EDGE) - EDGE;

  const line = (path, box, cy, from, span) => {
    ctx.save();
    ctx.setTransform(dpr * s, 0, 0, dpr * s,
      dpr * (W / 2 - (box.x + box.w / 2) * s), dpr * (cy - (box.y + box.h / 2) * s));
    /* The gradient runs along the writing, and is tilted by the height of the
       line over its width — a slope, not a vertical cut. */
    const x0 = box.x, x1 = box.x + box.w, tilt = box.h * 0.5;
    const g = ctx.createLinearGradient(x0, tilt, x1, -tilt);
    for (let i = 0; i <= 24; i++) {
      const u = i / 24;
      const local = (from + u * span - wipe) / EDGE;   // where this stop sits
      const a = Math.min(1, Math.max(0, -local));
      g.addColorStop(u, `rgba(240,228,208,${(0.88 * a).toFixed(3)})`);
    }
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 90;
    ctx.fillStyle = g;
    ctx.fill(path);
    ctx.restore();
  };

  if (L.twoLine) {
    // written in order: the first half over the opening of the reveal, the
    // second over the close, with the pen "lifting" between them
    line(note1Path, NOTE1_BOX, L.ntTop + L.lineH * 0.5, 0, 0.46);
    line(note2Path, NOTE2_BOX, L.ntTop + L.lineH * 1.5, 0.54, 0.46);
  } else {
    // one line: both halves share a box, so they share one gradient and the
    // reveal position is simply where a stop falls along it
    line(note1Path, NOTE_BOX, L.ntTop + L.lineH / 2, 0, 1);
    line(note2Path, NOTE_BOX, L.ntTop + L.lineH / 2, 0, 1);
  }
}

function drawAct3(t) {
  const front = burnFront(burn);
  if (front < 1 + CHAR) drawWordmark(t, front, 1);
  else drawSurvivor(smooth(B_GLIDE0, B_GLIDE1, burn), t);
  if (front > -PRE) drawAsh(front, t);
  drawLeadIn(smooth(B_LEAD0, B_LEAD1, burn), t);
  drawNote(smooth(B_NOTE0, B_NOTE1, burn), t);
}

/* --------------------------------------------------------------- input */
/* One monotonic timeline runs the whole piece. `prog` is the card and the name,
   `burn` is everything after — deriving both from one scroll position is what
   keeps the join between them from needing a handover at all. */
const TL_MAX = 2.32;
let target = 0, tl = 0, prog = 0, burn = 0, lava = 0;
/* Chrome reports ~100px per wheel notch; Firefox in line mode reports ~3 lines.
   33px/line makes a notch feel the same in both. */
const LINE = 33, PAGE = 120, STEP = 0.085;

function bump(d) {
  if (state !== 'card') return;
  target = Math.min(TL_MAX, Math.max(0, target + d));
  lastInput = performance.now();
}

function wheelAmount(e) {
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= LINE;             // Firefox reports lines, not px
  else if (e.deltaMode === 2) d *= PAGE;
  return Math.max(-140, Math.min(140, d));      // one violent trackpad fling ≠ whole animation
}

addEventListener('wheel', (e) => { e.preventDefault(); bump(wheelAmount(e) * 0.0009); }, { passive: false });
addEventListener('pointermove', (e) => {
  mx = e.clientX / W; my = e.clientY / H;
  /* Only a real mouse gets it. A touch pointer has nothing to replace, and
     reduced motion keeps the system arrow, since something that lags behind the
     hand is exactly the kind of motion that setting is asking us not to add. */
  if (!curLive && CUR_OK && e.pointerType === 'mouse') {
    curLive = true; curX = e.clientX; curY = e.clientY;
    curDot.classList.add('on'); curRing.classList.add('on');
  }
});

let lastY = null;
addEventListener('touchstart', (e) => { lastY = e.touches[0].clientY; }, { passive: true });
addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (lastY != null) bump((lastY - e.touches[0].clientY) * 0.0016);
  lastY = e.touches[0].clientY;
}, { passive: false });
addEventListener('touchend', () => { lastY = null; }, { passive: true });

/* Keyboard. The wheel handler preventDefaults everything and the body is
   overflow:hidden, so without this the page cannot be advanced at all. */
const KEYS = {
  ArrowDown: STEP, ArrowRight: STEP, PageDown: STEP * 3, ' ': STEP * 3, Spacebar: STEP * 3,
  ArrowUp: -STEP, ArrowLeft: -STEP, PageUp: -STEP * 3,
};
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Home') { e.preventDefault(); target = 0; lastInput = performance.now(); return; }
  if (e.key === 'End')  { e.preventDefault(); target = TL_MAX; lastInput = performance.now(); showCue(false); return; }
  const d = KEYS[e.key];
  if (d === undefined) return;
  e.preventDefault();
  bump(d);
});

/* --------------------------------------------------------------- lifecycle */
let state = 'pre';                              // pre | intro | entrance | card
let xfade = 0, entrance = 0, cueShown = false, lastInput = 0;

function showCue(on) {
  if (on === cueShown) return;
  cueShown = on;
  cueEl.classList.toggle('show', on);
  cueEl.classList.toggle('anim', on && !REDUCED);
}

/* The cue comes back when the name has formed and the reader has stopped, since
   nothing else says the piece has a second half. Gated on a pause rather than on
   the position alone, so scrolling straight through doesn't flash it. */
function cueState(now) {
  if (state !== 'card') return false;
  if (target < 0.02) return true;
  return target > 0.9 && target < 1.06 && now - lastInput > 1300;
}

function toCard() { if (state !== 'card') { state = 'card'; showCue(true); } }

/* Safari decodes VP9 but ignores the alpha channel, so the intro would render
   as an opaque black slab rather than failing outright. Probe the decoded frame
   instead of trusting the codec string. */
function alphaWorks() {
  try {
    const p = document.createElement('canvas'); p.width = p.height = 8;
    const pc = p.getContext('2d');
    pc.clearRect(0, 0, 8, 8);
    pc.drawImage(vid, 0, 0, 8, 8);
    const d = pc.getImageData(0, 0, 8, 8).data;
    const corners = [0, 7, 56, 63].map((i) => d[i * 4 + 3]);
    return Math.min.apply(null, corners) < 200;
  } catch { return false; }
}

let videoFailed = false;
function failVideo(why) {
  if (videoFailed) return;
  videoFailed = true;
  if (DEBUG) console.warn('[intro] falling back to canvas entrance:', why);
  try { vid.pause(); } catch { /* already gone */ }
  if (state === 'pre' || state === 'intro') { state = 'entrance'; entrance = 0; }
}

vid.addEventListener('error', () => failVideo('media error'));
vid.addEventListener('stalled', () => failVideo('stalled'));
vid.addEventListener('loadeddata', () => { if (!alphaWorks()) failVideo('no alpha compositing'); });
vid.addEventListener('ended', () => { if (state === 'intro') xfade = 0.0001; });

/* Watchdog on real playback progress. The old check was
   `intro.paused || currentTime === 0`, which a video that is playing but wedged
   mid-buffer satisfies neither of — leaving the page stuck on the embers with
   no card and no way out. */
let seenTime = -1, seenAt = 0;
function watchdog(now) {
  if (state !== 'intro') return;
  if (vid.currentTime !== seenTime) { seenTime = vid.currentTime; seenAt = now; return; }
  if (now - seenAt > 1500) failVideo('no progress for 1.5s');
}

function startIntro() {
  pre.classList.add('gone');
  if (REDUCED || videoFailed) { toCard(); return; }
  state = 'intro'; seenTime = -1; seenAt = performance.now();
  vid.currentTime = 0;
  vid.playbackRate = PLAYBACK;
  const p = vid.play();
  if (p && p.catch) p.catch(() => failVideo('play() rejected'));
}

/* Gate the opener on the assets actually being ready instead of a bare 1600ms
   timer, so a slow connection can't produce a black gap. */
function ready(promise, ms) {
  return Promise.race([promise, new Promise((res) => setTimeout(() => res('timeout'), ms))]);
}
/* card.webp is the same 1053x1494 art at q92 — 246KB against the PNG's 2271KB,
   for a mean error of 1.5/255. The PNG stays as the fallback and the master. */
const imgReady = new Promise((res) => {
  let triedPng = false;
  img.onload = () => res('ok');
  img.onerror = () => {
    if (!triedPng) { triedPng = true; img.src = 'assets/card.png'; return; }
    console.error('[card] could not load the card image');
    res('error');
  };
  img.src = 'assets/card.webp';
});
const vidReady = new Promise((res) => {
  if (REDUCED) return res('skipped');
  vid.addEventListener('canplaythrough', () => res('ok'), { once: true });
  vid.addEventListener('error', () => res('error'), { once: true });
});

Promise.all([ready(imgReady, 8000), ready(vidReady, 6000)]).then(() => {
  resize();
  if (REDUCED) { startIntro(); return; }
  spark.classList.add('ignite');
  setTimeout(startIntro, 1250);
});

/* --------------------------------------------------------------- resize */
let rt = null, lastW = -1, lastH = -1;
function resize() {
  /* A hidden pane, a restoring background tab, or some embedded contexts report
     a 0x0 viewport. Building the world at that size produces a degenerate
     scene, so wait for real dimensions instead. */
  if (innerWidth < 2 || innerHeight < 2) {
    clearTimeout(rt); rt = setTimeout(resize, 200);
    return;
  }
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  portrait = H > W;
  stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildParticles();
  buildBg();
  buildFlame();
  buildLava();
  buildVidLayer();
  buildBurnLayer();
  buildBurnField();
  buildAsh();                                   // needs both of the two above
  lastW = W; lastH = H;
}
/* Debounced: this rebuilds every particle and samples a full-viewport canvas,
   and browsers fire resize continuously while a window edge is dragged (and
   whenever a mobile URL bar shows or hides). */
addEventListener('resize', () => {
  if (innerWidth === lastW && innerHeight === lastH) return;
  clearTimeout(rt);
  rt = setTimeout(resize, 150);
});
addEventListener('orientationchange', () => { clearTimeout(rt); rt = setTimeout(resize, 250); });

/* --------------------------------------------------------------- frame */
let t0 = performance.now(), last = t0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;

  // frame-rate independent: the old *0.12 per frame ran 2.4x faster at 144Hz
  tl += (target - tl) * (1 - Math.exp(-7.6 * dt));
  prog = Math.min(1, tl);
  burn = Math.max(0, tl - 1);
  lava = smooth(0.10, 0.98, burn);
  // the fire catches the moment the card becomes scrollable, not before — and
  // goes out once the name it lit is carrying the burning
  if (state === 'card' && flameLit < 1) flameLit = Math.min(1, flameLit + dt / FLAME_IGNITE);
  flameNow = flameLit * (1 - smooth(0, 0.30, burn));
  showCue(cueState(now));

  drawBackground(t, dt);
  watchdog(now);

  if (state === 'intro') {
    if (xfade > 0) {
      xfade = Math.min(1, xfade + dt / 0.26);
      const e = smooth(0, 1, xfade);
      /* Order matters. Drawing the video at (1-e) and the card at e composites
         each against the embers separately, so the result is
         C*e + V*(1-e)^2 + B*e*(1-e) -- at the midpoint the card is only 75%
         covered and the background bleeds through as a visible dip. Laying the
         card down opaque first and dissolving the video over it gives
         V*(1-e) + C*e, which holds full opacity the whole way across. */
      drawCard(1);
      drawVideo(1 - e);
      if (xfade >= 1) toCard();
    } else if (!drawVideo(1)) {
      drawCard(1);                              // first frames not decoded yet
    }
  } else if (state === 'entrance') {
    entrance = Math.min(1, entrance + dt / 0.95);
    drawEntrance(entrance);
    if (entrance >= 1) toCard();
  } else if (state === 'card') {
    /* At tl exactly 1 the dust has fully resolved and drawParticles is drawing
       nothing but the solid wordmark, which is where act 3 picks up — so the
       two branches meet on the same frame rather than crossfading. */
    if (burn > 0) drawAct3(t);
    else drawParticles(prog, t);
  }

  post(now);
  moveCursor(dt);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

if (DEBUG) {
  window.__set = (p) => {
    target = tl = Math.min(TL_MAX, Math.max(0, p));
    prog = Math.min(1, tl); burn = Math.max(0, tl - 1);
    lastInput = performance.now();
    toCard();
  };
  window.__state = () => ({ W, H, dpr, cell, state, tl, prog, burn, target, portrait,
    front: burnFront(burn), particles: particles.length, groups: colGroups.length,
    textPts: textPts.length, ash: ashPts.length, burnField: [burnW, burnH],
    card, vidRect, nmRect, videoFailed });
}
</script>
</body>
